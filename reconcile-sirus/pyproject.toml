[project]
name = "reconcile-sirus"
version = "0.1.0"
description = "Conciliation COICOP par règles interprétables (SIRUS) — entraînement R, prédiction Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.4",
    "mlflow>=3.9.0",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=16",
    # Pour `load_all_observations` : la fusion des 4 classifieurs et la
    # troncature niveau 4 ne sont PAS réimplémentées ici.
    "reconcile-llm",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
reconcile-llm = { workspace = true }
