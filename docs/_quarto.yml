format:
  html:
    theme:
      light: [flatly, brand.scss]
      dark: [darkly, brand.scss]
    toc: true
    toc-depth: 3
    toc-title: "Sur cette page"
    code-copy: true
    code-overflow: wrap
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    lang: fr
