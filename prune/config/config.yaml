# config.yaml — étape `prune` (pruning unifié)
# Les {run_date}/{run_id} sont substitués au runtime via expand_paths().

# Nomenclature COICOP brute (source du pruning + des libellés label_fr).
nomenclature_raw: "s3://projet-budget-famille/data/coicop-2018_envoi_rmes_20251022.csv"

# Colonnes conservées des fichiers d'annotations.
features:
  - id
  - l_pr_product
  - annee
  - code
  - coicop
  - shop
  - shop_type_name
  - budget
  - n_obs
  - source

# Entrées (sorties de codif-regex) :
#   - train = KB (lot train en éval / toutes les annotations en prod) ;
#   - test  = jeu à coder (split test en éval / observations en prod).
annotations_train: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/codif-regex/raw_train_without_regex.parquet"
annotations_test:  "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/codif-regex/raw_test_without_regex.parquet"

# Suggester (source CSV autoportante).
product_col: l_pr_product   # colonne texte cible (cohérente avec le module annotations)
suggester:
  s3_path: "s3://projet-budget-famille/data/input-annotation/liste_produits_fr_copain.csv"
  source_product_col: product
  code_col: code
  coicop_col: coicop
  dedup: true

# Sorties prunées (par run, sous prune/).
outputs:
  nomenclature_pruned:      "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune/nomenclature_pruned.parquet"
  mapping_lvl4:             "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune/mapping_lvl4.parquet"
  annotations_train_pruned: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune/annotations_train_pruned.parquet"
  annotations_test_pruned:  "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune/annotations_test_pruned.parquet"
  suggester_pruned:         "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune/suggester_pruned.parquet"
