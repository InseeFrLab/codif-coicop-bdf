# config.yaml — RAG sur exemples annotés
# Les chemins {run_date}/{run_id} sont substitués au runtime via expand_paths().

annotations:
  # Données annotées brutes (descriptions produits + code COICOP), avant prunning.
  # Même source que coicop-rag (sortie de codif-regex).
  s3_path: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/codif-regex/raw_train_without_regex.parquet"
  features:
    - id
    - l_pr_product
    - annee
    - code
    - coicop
    - shop
    - shop_type_name
    - budget
    - n_obs
    - source
  product_col: l_pr_product   # colonne texte à embedder
  nature: null                # filtre optionnel sur la colonne `source`

# Données du suggester ajoutées à l'index, aux côtés des annotations de train.
# Codes au niveau 5 et non prunés en amont → on leur applique exactement le même
# prune_annotation_lvl4 (troncature niveau 4 + mapping) que les annotations.
suggester:
  enabled: true
  # CSV source autoportant (toujours disponible). Colonnes : product, code, coicop.
  s3_path: "s3://projet-budget-famille/data/input-annotation/liste_produits_fr_copain.csv"
  product_col: product   # colonne texte dans la source suggester
  code_col: code
  coicop_col: coicop
  # Toutes les observations sont indexées. dedup=true retire seulement les doublons
  # exacts (product, code, coicop) — comme le preprocessing. Mettre false pour
  # indexer littéralement chaque ligne, doublons compris.
  dedup: true

coicop:
  path_raw: "s3://projet-budget-famille/data/coicop-2018_envoi_rmes_20251022.csv"
  # Table de mapping produite par 0_prunning_coicop.py (coicop-rag)
  path_mapping_lvl4: "s3://projet-budget-famille/data/workflow_outputs/prunning/coicop-2018_envoi_rmes_20251022_mapping_prunning_lvl4.parquet"

qdrant:
  collection_name: "coicop_annotations"
  upload_batch_size: 56

embedding:
  model_name: qwen3-embedding-8b
  model_len: 4096
  batch_size: 64

retrieval:
  size: 10

llm:
  # Source du prompt : local (défaut) ou Langfuse.
  use_langfuse: true
  prompt_file: prompts/annotation_rag.md
  prompt_name: prompt-annotation-rag
  prompt_version: "2"   # version Langfuse épinglée (évite de charger le mauvais prompt)
  model_name: gemma4-26b-moe
  temperature: 0.1
  max_tokens: 2048
  concurrency: 32

eval:
  # L'évaluation est opt-in : pilotée par --skip-eval (défaut 'true' = production).
  # En mode évaluation, l'input doit contenir les labels (`code` / `coicop`).
  threshold_confidence: 0.7
  levels: 4   # évalue les niveaux COICOP 1..levels
  seed: 42    # graine pour l'échantillonnage optionnel (--sample_size)

# Produits à codifier (input du RAG) :
#   - mode évaluation : test labellisé pruné (prune-annotations, déjà tronqué/pruné) ;
#   - mode production  : données à codifier (sans labels).
# + artefact produit par ce module (prédictions).
data:
  s3_path_input: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune-annotations/raw_test_without_regex_pruned.parquet"
  s3_path_predictions: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/rag-annotation/predictions.parquet"

mlflow:
  experiment_name: rag-annotation
