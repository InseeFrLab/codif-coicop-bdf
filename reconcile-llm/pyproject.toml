[project]
name = "reconcile-llm"
version = "0.1.0"
description = "Arbitrage LLM (LLM-as-judge) du code COICOP final pour le pipeline BdF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.4",
    "openai>=2.16.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.9",
    "prune-codes",
    "codif-common",
]

[tool.uv.sources]
codif-common = { workspace = true }
prune-codes = { workspace = true }

# Rend `reconcile_llm` importable depuis un module frère : `reconcile-sirus/` réutilise
# `load_all_observations` pour ne pas dupliquer la fusion des 4 classifieurs ni
# la troncature niveau 4. Sans `[build-system]`, `uv` ne sait pas construire ce
# module et ne peut donc pas l'installer comme dépendance.
#
# `main.py` n'est pas concerné : son `from src.reconcile_llm import ...` lit les
# fichiers du dossier courant, pas le paquet installé.
#
# `sources = ["src"]` retire le préfixe `src/`, pour que le module s'installe
# comme `reconcile_llm` et non `src.reconcile_llm`.
#
# `only-include` restreint la wheel à CE SEUL fichier. Vérifié : l'élargir à
# `["src"]` embarquerait aussi `src/__init__.py`, qui — le préfixe étant retiré —
# se poserait en `__init__.py` à la racine du site-packages du consommateur, un
# nom qu'aucun paquet ne possède et qui collisionnerait avec tout autre paquet
# faisant la même chose. (Supprimer `only-include` ne marche pas non plus :
# hatchling refuse de construire, faute d'un dossier nommé `reconcile_llm`.)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/reconcile_llm.py"]
sources = ["src"]

[tool.hatch.build.targets.editable]
only-include = ["src/reconcile_llm.py"]
sources = ["src"]
