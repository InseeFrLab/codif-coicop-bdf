apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: codif-
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  podSpecPatch: |
    containers:
      - name: main
        env:
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"

  arguments:
    parameters:
      # Branche du dépôt clonée par TOUS les steps (git clone --branch ...).
      # Défaut = main ; surcharger pour tester une feature branch sans merge.
      - name: git-branch
        value: main
      - name: input_file
        value: s3://projet-budget-famille/data/workflow_inputs/BDF_data_tickets_appli_20260320_a_codif.csv
      - name: text_column
        value: NAT_DEP
      - name: shop_column
        value: "MAG_DEP"
      - name: budget_column
        value: "MONT_DEP"
      - name: annee_column
        value: ""
      - name: source_column
        value: ""
      # Sampling — deux curseurs :
      #   sample-annotations : plafonne la KB d'annotations (vector DB) ;
      #   sample-observations : plafonne le jeu à coder (inférence lcs/rag/rag-annotations).
      # En mode évaluation, l'inférence porte sur le split test des annotations →
      # elle utilise sample-annotations (sample-observations n'a pas de sens en éval).
      - name: sample-annotations
        value: ""
      - name: sample-observations
        value: ""
      - name: classify-rag-model
        value: "gemma4-26b-moe"
      - name: skip-index
        value: "true"
      - name: run_id
        value: "{{workflow.name}}"
      - name: run_date
        value:
          "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{wor\
          kflow.creationTimestamp.d}}"
      - name: reconcile-llm-model
        value: "gemma4-26b-moe"
      - name: reconcile-llm-concurrency
        value: "5"
      - name: classify-ttc-model-uri
        value: "mlflow-artifacts:/10/cacf2603514b4887bbfb77e2654c9bc1/artifacts/model"
      - name: skip-report
        value: "false"
      - name: report-experiment
        value: "codif-coicop-eval"

      # --- Conciliation : EXCLUSIVE ------------------------------------------
      # `llm`   → reconcile-llm (juge LLM), comportement historique
      # `sirus` → reconcile-sirus (re-ranking par règles interprétables)
      # L'étape non retenue est skippée ; export-results et report dépendent des
      # deux et tolèrent qu'une soit Skipped. Les deux ne tournent jamais
      # ensemble, par choix : un seul code final par produit, sans ambiguïté.
      - name: reconciliation
        value: llm
        enum: [llm, sirus]

      # Modèle SIRUS chargé par reconcile-sirus. Obligatoire quand
      # reconciliation: sirus. L'entraînement se fait HORS pipeline
      # (`reconcile-sirus/train.sh`, cf. reconcile-sirus/README.md) et logue le modèle dans MLflow ;
      # on recopie ici l'URI qu'il affiche — même pratique que classify-ttc-model-uri.
      - name: reconcile-sirus-model-uri
        value: ""

  templates:
    # -----------------------------------------------------------------------
    # Main pipeline: DAG with parallelism
    #
    # Les 4 classifieurs tournent en parallèle, puis une conciliation tranche.
    # `prune-codes` (post classify-regex) produit TOUS les artefacts prunés
    # (nomenclature, mapping, annotations train/test, suggester) ; l'aval ne fait que lire.
    # Les 2 `index-*` sont skippables (paramètre skip-index).
    #
    #   build-datasets ──→ classify-regex ─┬─→ classify-lcs ─────────────────────────────────────────────────────┐
    #                       (→ prune-codes)├─→ classify-ttc ─────────────────────────────────────────────────────┤
    #                                      └─→ prune-codes ─┬─→ index-notices ─────→ classify-rag-notices ───────┤
    #                                                        └─→ index-annotations ─→ classify-rag-annotations ──┘
    #                                                                                                            │
    #                                                       ┌────────────────────────────────────────────────────┘
    #                                                       └─→ reconcile-llm  OU  reconcile-sirus   (exclusifs : paramètre conciliation)
    #                                                               └─→ export-results ─→ report  (opt-in)
    # -----------------------------------------------------------------------
    - name: pipeline
      dag:
        tasks:
          - name: build-datasets
            template: build-datasets
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"
                - name: source_column
                  value: "{{workflow.parameters.source_column}}"

          - name: classify-regex
            dependencies: [build-datasets]
            template: classify-regex
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          # Étape unifiée : produit tous les artefacts prunés (nomenclature, mapping,
          # annotations train/test, suggester). Non gated : nécessaire même sans vector DB.
          - name: prune-codes
            dependencies: [classify-regex]
            template: prune-codes
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-lcs
            dependencies: [classify-regex]
            template: classify-lcs
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: index-notices
            dependencies: [prune-codes]
            template: index-notices
            when: '"{{workflow.parameters.skip-index}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: index-annotations
            dependencies: [prune-codes]
            template: index-annotations
            when: '"{{workflow.parameters.skip-index}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-rag-notices
            dependencies: [index-notices, prune-codes]
            template: classify-rag-notices
            arguments:
              parameters:
                - name: classify-rag-model
                  value: "{{workflow.parameters.classify-rag-model}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-rag-annotations
            dependencies: [index-annotations, prune-codes]
            template: classify-rag-annotations
            arguments:
              parameters:
                - name: classify-rag-model
                  value: "{{workflow.parameters.classify-rag-model}}"
                - name: sample-annotations
                  value: "{{workflow.parameters.sample-annotations}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-ttc
            dependencies: [classify-regex]
            template: classify-ttc
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: classify-ttc-model-uri
                  value: "{{workflow.parameters.classify-ttc-model-uri}}"

          # Conciliation, variante 1 : le juge LLM. Skippée quand
          # reconciliation=sirus. Testée sur `!= "sirus"` et non `== "llm"` :
          # si `enum` n'était pas honoré et qu'on soumettait une valeur
          # inattendue, on dégrade vers le comportement historique (LLM seul)
          # plutôt que vers « aucune des deux », qui laisserait export-results
          # lire un parquet inexistant.
          - name: reconcile-llm
            dependencies: [classify-lcs, classify-rag-notices, classify-rag-annotations, classify-ttc]
            template: reconcile-llm
            when: '"{{workflow.parameters.reconciliation}}" != "sirus"'
            arguments:
              parameters:
                - name: reconcile-llm-model
                  value: "{{workflow.parameters.reconcile-llm-model}}"
                - name: reconcile-llm-concurrency
                  value: "{{workflow.parameters.reconcile-llm-concurrency}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          # Conciliation, variante 2 : les règles SIRUS. `prune-codes` est dans les
          # dépendances parce que l'étape lit prune-codes/mapping_lvl4.parquet.
          # Le modèle vient de MLflow, jamais du run courant : l'entraînement
          # est hors pipeline, donc prédire sur ses propres données
          # d'entraînement est impossible par construction.
          - name: reconcile-sirus
            dependencies: [classify-lcs, classify-rag-notices, classify-rag-annotations, classify-ttc, prune-codes]
            template: reconcile-sirus
            when: '"{{workflow.parameters.reconciliation}}" == "sirus"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: reconcile-sirus-model-uri
                  value: "{{workflow.parameters.reconcile-sirus-model-uri}}"

          # Dépend des DEUX conciliations : la forme historique `dependencies:`
          # se développe en `Succeeded || Skipped || Daemoned`, donc l'étape
          # skippée satisfait sa clause. Même mécanisme que index-notices →
          # classify-rag-notices. Ne pas passer à `depends:` : le dépôt n'en utilise nulle
          # part et mélanger les deux formes est un piège de maintenance.
          - name: export-results
            dependencies: [reconcile-llm, reconcile-sirus]
            template: export-results
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: reconciliation
                  value: "{{workflow.parameters.reconciliation}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"

          - name: report
            dependencies: [build-datasets, classify-regex, classify-lcs, classify-rag-notices, classify-rag-annotations, classify-ttc, reconcile-llm, reconcile-sirus, export-results]
            template: report
            when: '"{{workflow.parameters.skip-report}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: reconciliation
                  value: "{{workflow.parameters.reconciliation}}"
                - name: reconcile-sirus-model-uri
                  value: "{{workflow.parameters.reconcile-sirus-model-uri}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: report-experiment
                  value: "{{workflow.parameters.report-experiment}}"
                - name: classify-rag-model
                  value: "{{workflow.parameters.classify-rag-model}}"
                - name: reconcile-llm-model
                  value: "{{workflow.parameters.reconcile-llm-model}}"
                - name: reconcile-llm-concurrency
                  value: "{{workflow.parameters.reconcile-llm-concurrency}}"
                - name: classify-ttc-model-uri
                  value: "{{workflow.parameters.classify-ttc-model-uri}}"
                - name: skip-index
                  value: "{{workflow.parameters.skip-index}}"
                - name: skip-report
                  value: "{{workflow.parameters.skip-report}}"
                - name: step-timings
                  value: |
                    {"build-datasets":["{{tasks.build-datasets.startedAt}}","{{tasks.build-datasets.finishedAt}}"],
                     "classify-regex":["{{tasks.classify-regex.startedAt}}","{{tasks.classify-regex.finishedAt}}"],
                     "classify-lcs":["{{tasks.classify-lcs.startedAt}}","{{tasks.classify-lcs.finishedAt}}"],
                     "classify-rag-notices":["{{tasks.classify-rag-notices.startedAt}}","{{tasks.classify-rag-notices.finishedAt}}"],
                     "classify-rag-annotations":["{{tasks.classify-rag-annotations.startedAt}}","{{tasks.classify-rag-annotations.finishedAt}}"],
                     "classify-ttc":["{{tasks.classify-ttc.startedAt}}","{{tasks.classify-ttc.finishedAt}}"],
                     "reconcile-llm":["{{tasks.reconcile-llm.startedAt}}","{{tasks.reconcile-llm.finishedAt}}"],
                     "reconcile-sirus":["{{tasks.reconcile-sirus.startedAt}}","{{tasks.reconcile-sirus.finishedAt}}"]}

    # -----------------------------------------------------------------------
    # Step 0: Preprocessing — construction du dataset
    # -----------------------------------------------------------------------
    - name: build-datasets
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: text_column
          - name: shop_column
          - name: budget_column
          - name: annee_column
          - name: source_column
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/build-datasets
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file vide => mode évaluation : ne pas passer --input-file ni les colonnes (sens uniquement en prédiction)
            if [ -n "{{inputs.parameters.input_file}}" ]; then
              ARGS="$ARGS --input-file {{inputs.parameters.input_file}} --text-column {{inputs.parameters.text_column}}"
              [ -n "{{inputs.parameters.shop_column}}" ]   && ARGS="$ARGS --shop-column {{inputs.parameters.shop_column}}"
              [ -n "{{inputs.parameters.budget_column}}" ] && ARGS="$ARGS --budget-column {{inputs.parameters.budget_column}}"
              [ -n "{{inputs.parameters.annee_column}}" ]  && ARGS="$ARGS --annee-column {{inputs.parameters.annee_column}}"
              [ -n "{{inputs.parameters.source_column}}" ] && ARGS="$ARGS --source-column {{inputs.parameters.source_column}}"
            fi
            uv run --locked --no-dev main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 0b: Codification par regex
    # -----------------------------------------------------------------------
    - name: classify-regex
      inputs:
        parameters:
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/classify-regex
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file non vide => mode production (train=annotations_full, test=observations)
            [ -n "{{workflow.parameters.input_file}}" ] && ARGS="$ARGS --input-file {{workflow.parameters.input_file}}"
            # Sampling CENTRALISÉ des observations (unique point) : sample-observations en prod,
            # sample-annotations en éval. Tous les classifieurs aval héritent de ce jeu.
            SAMPLE_OBS="{{workflow.parameters.sample-observations}}"
            [ -z "{{workflow.parameters.input_file}}" ] && SAMPLE_OBS="{{workflow.parameters.sample-annotations}}"
            [ -n "$SAMPLE_OBS" ] && ARGS="$ARGS --sample-size $SAMPLE_OBS"
            uv run --locked --no-dev src/main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 0c: Codification par LCS
    # -----------------------------------------------------------------------
    - name: classify-lcs
      inputs:
        parameters:
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-r-python-julia:r4.5.3-py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/classify-lcs
            # Échantillonnage centralisé en amont (classify-regex) → pas de sampling ici.
            ARGS="--run-id={{inputs.parameters.run_id}} --run-date={{inputs.parameters.run_date}}"
            Rscript R/main.R $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 1: Pruning unifié — nomenclature + mapping + annotations train/test + suggester
    # -----------------------------------------------------------------------
    - name: prune-codes
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/prune-codes
            uv sync --locked --no-dev
            uv run --locked --no-dev scripts/main.py --config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 2b: Create vector database
    # -----------------------------------------------------------------------
    - name: index-notices
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/rag-notices
            uv run --locked --no-dev scripts/0_create_vector_db.py --config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
          - name: LLMLAB_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_URL
          - name: LLMLAB_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_API_KEY
          - name: QDRANT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_URL
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_KEY
          - name: QDRANT_API_PORT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_PORT
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 3: Run RAG pipeline
    # -----------------------------------------------------------------------
    - name: classify-rag-notices
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: classify-rag-model
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/rag-notices
            mkdir -p logs prompts

            ARGS="--config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"

            # Échantillonnage centralisé en amont (classify-regex) → pas de sampling ici.
            if [ -n "{{inputs.parameters.classify-rag-model}}" ]; then
              ARGS="$ARGS --model_name {{inputs.parameters.classify-rag-model}}"
            fi

            uv run --locked --no-dev scripts/2_run_rag.py $ARGS
        env:
