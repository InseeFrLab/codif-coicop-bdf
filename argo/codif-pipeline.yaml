    # -----------------------------------------------------------------------
    # Step 7 (opt-in): accuracy report (Quarto HTML on S3)
    # -----------------------------------------------------------------------
    - name: report
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: report-experiment
          - name: classify-rag-model
          - name: reconcile-llm-model
          - name: reconcile-llm-concurrency
          - name: classify-ttc-model-uri
          - name: skip-index
          - name: skip-report
          - name: reconciliation
          - name: reconcile-sirus-model-uri
          - name: step-timings
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/report
            uv sync --locked --no-dev

            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}} \
                  --experiment-name {{inputs.parameters.report-experiment}} \
                  --reconcile-llm-model {{inputs.parameters.reconcile-llm-model}} \
                  --reconcile-llm-concurrency {{inputs.parameters.reconcile-llm-concurrency}} \
                  --skip-index {{inputs.parameters.skip-index}} \
                  --skip-report {{inputs.parameters.skip-report}}"

            [ -n "{{inputs.parameters.input_file}}" ]    && ARGS="$ARGS --input-file {{inputs.parameters.input_file}}"
            # Échantillon observations (pour le rapport) : sample-observations en prod, sample-annotations en éval.
            SAMPLE_OBS="{{workflow.parameters.sample-observations}}"
            [ -z "{{workflow.parameters.input_file}}" ] && SAMPLE_OBS="{{workflow.parameters.sample-annotations}}"
            [ -n "$SAMPLE_OBS" ]                         && ARGS="$ARGS --sample-size $SAMPLE_OBS"
            [ -n "{{inputs.parameters.classify-rag-model}}" ]    && ARGS="$ARGS --classify-rag-model {{inputs.parameters.classify-rag-model}}"
            [ -n "{{inputs.parameters.classify-ttc-model-uri}}" ] && ARGS="$ARGS --classify-ttc-model-uri {{inputs.parameters.classify-ttc-model-uri}}"
            # Détermine quel parquet de conciliation le rapport lit.
            ARGS="$ARGS --reconciliation {{inputs.parameters.reconciliation}}"
            [ -n "{{inputs.parameters.reconcile-sirus-model-uri}}" ] && ARGS="$ARGS --reconcile-sirus-model-uri {{inputs.parameters.reconcile-sirus-model-uri}}"

            # step-timings is JSON (spaces/newlines): pass it directly with literal
            # single quotes so it stays one argument (it must NOT go through $ARGS,
            # which would word-split it on expansion).
            uv run --locked --no-dev main.py $ARGS --step-timings '{{inputs.parameters.step-timings}}'
        env:
          - name: MLFLOW_TRACKING_URI
