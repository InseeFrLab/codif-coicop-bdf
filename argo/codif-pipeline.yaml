apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: codif-
spec:
  entrypoint: codification
  serviceAccountName: workflow

  podSpecPatch: |
    containers:
      - name: main
        env:
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"

  arguments:
    parameters:
      # Branche du dépôt clonée par TOUS les steps (git clone --branch ...).
      # Défaut = main ; surcharger pour tester une feature branch sans merge.
      - name: git-branch
        value: main
      - name: input_file
        value: s3://projet-budget-famille/data/workflow_inputs/BDF_data_tickets_appli_20260320_a_codif.csv
      - name: text_column
        value: NAT_DEP
      - name: shop_column
        value: "MAG_DEP"
      - name: budget_column
        value: "MONT_DEP"
      - name: annee_column
        value: ""
      - name: source_column
        value: ""

      # --- Évaluation : facultative, et déclenchée par les données -----------
      # Le pipeline n'a plus qu'un mode. L'évaluation est une étape finale qui
      # ne tourne que si le fichier d'entrée porte des étiquettes.
      #
      # `label-column` est le déclencheur : nom de la colonne de vérité dans le
      # CSV d'entrée. Vide = pas d'évaluation, l'étape est sautée.
      - name: label-column
        value: ""
      # Dimension d'analyse du rapport d'évaluation : accuracy ventilée par
      # provenance du produit. Ne restreint JAMAIS le périmètre codé.
      - name: eval-source-column
        value: ""
      - name: skip-eval
        value: "false"
      - name: eval-experiment
        value: "codif-coicop-eval"
      # Plafonne le jeu À CODER, dans les deux modes (vide = tout). Tirage
      # unique à classify-regex, hérité par les 4 classifieurs.
      # Pour plafonner la KB indexée : `kb-sample-size` de
      # argo/index-annotations-pipeline.yaml — ce n'est pas ici.
      - name: sample-observations
        value: ""
      - name: classify-rag-model
        value: "gemma4-26b-moe"

      # --- Vector DB : OBLIGATOIRES ------------------------------------------
      # Collections Qdrant produites hors de ce pipeline (index-*-pipeline.yaml,
      # qui affichent la ligne à recopier ici). Défaut vide DÉLIBÉRÉMENT : Argo
      # n'a pas de paramètre requis, donc la garde est doublée — `exit 1` dans le
      # conteneur et `required=True` en argparse. Un nom absent doit échouer en
      # secondes, pas retomber en silence sur l'index d'un autre run.
      #
      # ⚠️  Évaluation sur le lot historique → préférer une collection
      # `__train__` : une `__full__` contient les réponses attendues.
      - name: classify-rag-notices-collection
        value: ""
      - name: classify-rag-annotations-collection
        value: ""
      - name: run_id
        value: "{{workflow.name}}"
      - name: run_date
        value:
          "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{wor\
          kflow.creationTimestamp.d}}"
      - name: reconcile-llm-model
        value: "gemma4-26b-moe"
      - name: reconcile-llm-concurrency
        value: "5"
      - name: classify-ttc-model-uri
        value: "mlflow-artifacts:/10/cacf2603514b4887bbfb77e2654c9bc1/artifacts/model"
      - name: skip-report
        value: "false"
      - name: report-experiment
        value: "codif-coicop-eval"

      # --- Smoke run ----------------------------------------------------------
      # Le DAG tourne d'abord sur un échantillon (~8 min mesurées) ; s'il échoue,
      # le vrai run ne démarre pas. Attrape ce qui casse une étape (clone,
      # dépendance, config, paramètre, collection). N'attrape pas les pannes de
      # volume ni un livrable produit mais faux.
      - name: skip-smoke
        value: "false"
      # N'exécuter QUE la passe smoke, sans enchaîner sur le vrai run : pour
      # vérifier une branche en ~8 min. Le pendant de skip-smoke.
      - name: smoke-only
        value: "false"
      - name: smoke-observations
        value: "100"
      # Sans expérience dédiée, les métriques du smoke (100 lignes) seraient
      # indiscernables des vraies dans `test`, `rag-annotation` et l'expérience du rapport.
      - name: smoke-experiment
        value: "codif-coicop-smoke"

      # --- Conciliation : EXCLUSIVE ------------------------------------------
      # `llm`   → reconcile-llm (juge LLM), comportement historique
      # `sirus` → reconcile-sirus (re-ranking par règles interprétables)
      # L'étape non retenue est skippée ; export-results et report dépendent des
      # deux et tolèrent qu'une soit Skipped. Les deux ne tournent jamais
      # ensemble, par choix : un seul code final par produit, sans ambiguïté.
      - name: reconciliation
        value: llm
        enum: [llm, sirus]

      # Modèle SIRUS chargé par reconcile-sirus. Obligatoire quand
      # reconciliation: sirus. L'entraînement se fait HORS pipeline
      # (`reconcile-sirus/train.sh`, cf. reconcile-sirus/README.md) et logue le modèle dans MLflow ;
      # on recopie ici l'URI qu'il affiche — même pratique que classify-ttc-model-uri.
      - name: reconcile-sirus-model-uri
        value: ""

  # ===== Deux réglages à ne pas « nettoyer » ==============================
  #
  # `git -c http.version=HTTP/1.1` sur tous les clones. Le git de l'image
  # (2.54.0, lié à libcurl3-gnutls) ne sait pas lire la réponse HTTP/2 de
  # GitHub : il échoue sur « expected flush after ref listing » puis réclame un
  # Username — ce qui ressemble à un problème d'authentification et n'en est
  # pas (GitHub répond 200). HTTP/1.1 contourne le transport fautif.
  #
  # `retryStrategy` sur les 11 étapes (2 essais, backoff). Depuis que le smoke
  # conditionne le vrai run, un 503 passager bloquerait la production. La
  # politique est `OnFailure` et non `OnTransientError` : ce dernier ne couvre
  # que des erreurs qu'Argo sait reconnaître, or une panne réseau ressort ici en
  # code de sortie ordinaire. Rejouer est sûr — chaque étape réécrit ses sorties
  # en entier, et reconcile-llm reprend où il s'était arrêté.

  templates:
    # Entrypoint : le DAG tourne DEUX FOIS — smoke sur un échantillon, puis
    # pour de vrai. `dependencies:` (forme historique) se satisfait d'une tâche
    # réussie OU sautée, jamais d'une tâche échouée : c'est tout le gate.
    #   smoke réussi  → `full` démarre        smoke échoué  → `full` jamais
    #   smoke sauté   → `full` démarre (skip-smoke)
    # Les deux passes écrivent sous des run_id distincts (`…-smoke`), donc leurs
    # sorties S3 ne se mélangent pas.
    - name: codification
      dag:
        tasks:
          - name: smoke
            template: pipeline
            when: '"{{workflow.parameters.skip-smoke}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}-smoke"
                - name: sample-observations
                  value: "{{workflow.parameters.smoke-observations}}"
                - name: report-experiment
                  value: "{{workflow.parameters.smoke-experiment}}"
                - name: rag-experiment
                  value: "{{workflow.parameters.smoke-experiment}}"

          - name: full
            dependencies: [smoke]
            template: pipeline
            when: '"{{workflow.parameters.smoke-only}}" != "true"' 
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: sample-observations
                  value: "{{workflow.parameters.sample-observations}}"
                - name: report-experiment
                  value: "{{workflow.parameters.report-experiment}}"
                # Vide : les 2 étapes RAG gardent l'expérience de leur config.
                - name: rag-experiment
                  value: ""

    # Le DAG de codification lui-même. Les 4 classifieurs tournent en parallèle,
    # puis une conciliation tranche. L'indexation des vector DB n'est plus ici :
    # elle a ses propres workflows, et les collections sont passées en paramètre.
    #
    #   build-datasets ─→ classify-regex ─┬─→ classify-lcs ──────────────────┐
    #                                     ├─→ classify-ttc ──────────────────┤
    #                                     └─→ prune-codes ─┬─→ rag-notices ──┤
    #                                                      └─→ rag-annotations┘
    #                                                                        │
    #        reconcile-llm OU reconcile-sirus (exclusifs) ←──────────────────┘
    #                └─→ export-results ─→ report
    - name: pipeline
      inputs:
        parameters:
          # Ce qui DIFFÈRE entre la passe smoke et la passe réelle. Tout le
          # reste (input_file, colonnes, modèles, collections) est identique aux
          # deux et reste en portée workflow.
          - name: run_id                # suffixé `-smoke` pour isoler les sorties S3
          - name: sample-observations   # 100 pour le smoke, le paramètre réel sinon
          - name: report-experiment     # expérience MLflow du rapport
          - name: rag-experiment        # base des 2 expériences MLflow RAG, suffixée -notices / -annotations (vide = défaut du module)
      dag:
        tasks:
          - name: build-datasets
            template: build-datasets
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: label-column
                  value: "{{workflow.parameters.label-column}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"
                - name: source_column
                  value: "{{workflow.parameters.source_column}}"

          - name: classify-regex
            dependencies: [build-datasets]
            template: classify-regex
            arguments:
              parameters:
                - name: sample-observations
                  value: "{{inputs.parameters.sample-observations}}"
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          # Étape unifiée : produit tous les artefacts prunés (nomenclature, mapping,
          # annotations train/test, suggester). Non gated : nécessaire même sans vector DB.
          - name: prune-codes
            dependencies: [classify-regex]
            template: prune-codes
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-lcs
            dependencies: [classify-regex]
            template: classify-lcs
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          # L'indexation des vector DB ne fait plus partie de ce pipeline : elle
          # a ses propres workflows (argo/index-notices-pipeline.yaml et
          # argo/index-annotations-pipeline.yaml), au même titre que
          # l'entraînement de classify-ttc et de reconcile-sirus. Les deux
          # collections sont désignées par paramètre, ci-dessous.

          - name: classify-rag-notices
            dependencies: [prune-codes]
            template: classify-rag-notices
            arguments:
              parameters:
                - name: classify-rag-model
                  value: "{{workflow.parameters.classify-rag-model}}"
                - name: collection-name
                  value: "{{workflow.parameters.classify-rag-notices-collection}}"
                - name: mlflow-experiment
                  value: "{{inputs.parameters.rag-experiment}}"
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-rag-annotations
            dependencies: [prune-codes]
            template: classify-rag-annotations
            arguments:
              parameters:
                - name: classify-rag-model
                  value: "{{workflow.parameters.classify-rag-model}}"
                - name: collection-name
                  value: "{{workflow.parameters.classify-rag-annotations-collection}}"
                - name: mlflow-experiment
                  value: "{{inputs.parameters.rag-experiment}}"
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: classify-ttc
            dependencies: [classify-regex]
            template: classify-ttc
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: classify-ttc-model-uri
                  value: "{{workflow.parameters.classify-ttc-model-uri}}"

          # Conciliation, variante 1 : le juge LLM. Skippée quand
          # reconciliation=sirus. Testée sur `!= "sirus"` et non `== "llm"` :
          # si `enum` n'était pas honoré et qu'on soumettait une valeur
          # inattendue, on dégrade vers le comportement historique (LLM seul)
          # plutôt que vers « aucune des deux », qui laisserait export-results
          # lire un parquet inexistant.
          - name: reconcile-llm
            dependencies: [classify-lcs, classify-rag-notices, classify-rag-annotations, classify-ttc]
            template: reconcile-llm
            when: '"{{workflow.parameters.reconciliation}}" != "sirus"'
            arguments:
              parameters:
                - name: reconcile-llm-model
                  value: "{{workflow.parameters.reconcile-llm-model}}"
                - name: reconcile-llm-concurrency
                  value: "{{workflow.parameters.reconcile-llm-concurrency}}"
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          # Conciliation, variante 2 : les règles SIRUS. `prune-codes` est dans les
          # dépendances parce que l'étape lit prune-codes/mapping_lvl4.parquet.
          # Le modèle vient de MLflow, jamais du run courant : l'entraînement
          # est hors pipeline, donc prédire sur ses propres données
          # d'entraînement est impossible par construction.
          - name: reconcile-sirus
            dependencies: [classify-lcs, classify-rag-notices, classify-rag-annotations, classify-ttc, prune-codes]
            template: reconcile-sirus
            when: '"{{workflow.parameters.reconciliation}}" == "sirus"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: reconcile-sirus-model-uri
                  value: "{{workflow.parameters.reconcile-sirus-model-uri}}"

          # Dépend des DEUX conciliations : la forme historique `dependencies:`
          # se développe en `Succeeded || Skipped || Daemoned`, donc l'étape
          # skippée satisfait sa clause. Ne pas passer à `depends:` : le dépôt
          # n'en utilise nulle part et mélanger les deux formes est un piège de
          # maintenance.
          - name: export-results
            dependencies: [reconcile-llm, reconcile-sirus]
            template: export-results
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: reconciliation
                  value: "{{workflow.parameters.reconciliation}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"

          - name: report
            dependencies: [build-datasets, classify-regex, classify-lcs, classify-rag-notices, classify-rag-annotations, classify-ttc, reconcile-llm, reconcile-sirus, export-results]
            template: report
            when: '"{{workflow.parameters.skip-report}}" != "true"'
            arguments:
              parameters:
                - name: sample-observations
                  value: "{{inputs.parameters.sample-observations}}"
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: reconciliation
                  value: "{{workflow.parameters.reconciliation}}"
                - name: reconcile-sirus-model-uri
                  value: "{{workflow.parameters.reconcile-sirus-model-uri}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: report-experiment
                  value: "{{inputs.parameters.report-experiment}}"
                - name: classify-rag-model
                  value: "{{workflow.parameters.classify-rag-model}}"
                - name: reconcile-llm-model
                  value: "{{workflow.parameters.reconcile-llm-model}}"
                - name: reconcile-llm-concurrency
                  value: "{{workflow.parameters.reconcile-llm-concurrency}}"
                - name: classify-ttc-model-uri
                  value: "{{workflow.parameters.classify-ttc-model-uri}}"
                - name: classify-rag-notices-collection
                  value: "{{workflow.parameters.classify-rag-notices-collection}}"
                - name: classify-rag-annotations-collection
                  value: "{{workflow.parameters.classify-rag-annotations-collection}}"
                - name: skip-report
                  value: "{{workflow.parameters.skip-report}}"
                - name: step-timings
                  value: |
                    {"build-datasets":["{{tasks.build-datasets.startedAt}}","{{tasks.build-datasets.finishedAt}}"],
                     "classify-regex":["{{tasks.classify-regex.startedAt}}","{{tasks.classify-regex.finishedAt}}"],
                     "classify-lcs":["{{tasks.classify-lcs.startedAt}}","{{tasks.classify-lcs.finishedAt}}"],
                     "classify-rag-notices":["{{tasks.classify-rag-notices.startedAt}}","{{tasks.classify-rag-notices.finishedAt}}"],
                     "classify-rag-annotations":["{{tasks.classify-rag-annotations.startedAt}}","{{tasks.classify-rag-annotations.finishedAt}}"],
                     "classify-ttc":["{{tasks.classify-ttc.startedAt}}","{{tasks.classify-ttc.finishedAt}}"],
                     "reconcile-llm":["{{tasks.reconcile-llm.startedAt}}","{{tasks.reconcile-llm.finishedAt}}"],
                     "reconcile-sirus":["{{tasks.reconcile-sirus.startedAt}}","{{tasks.reconcile-sirus.finishedAt}}"]}

    # -----------------------------------------------------------------------
    # Step 0: Preprocessing — construction du dataset
    # -----------------------------------------------------------------------
          # --- Évaluation : facultative, dernière du DAG -----------------------
          # Ne tourne que si le fichier d'entrée portait des étiquettes. Sans
          # `label-column` il n'y a pas de vérité terrain et rien à mesurer : la
          # tâche est Skipped, ce qui est le cas nominal de production.
          - name: evaluate
            dependencies: [reconcile-llm, reconcile-sirus, classify-rag-notices, classify-rag-annotations, export-results]
            template: evaluate
            when: '"{{workflow.parameters.skip-eval}}" != "true" && "{{workflow.parameters.label-column}}" != ""'
            arguments:
              parameters:
                - name: run_id
                  value: "{{inputs.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: reconciliation
                  value: "{{workflow.parameters.reconciliation}}"
                - name: eval-source-column
                  value: "{{workflow.parameters.eval-source-column}}"
                - name: eval-experiment
                  value: "{{workflow.parameters.eval-experiment}}"

    - name: build-datasets
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: label-column
          - name: text_column
          - name: shop_column
          - name: budget_column
          - name: annee_column
          - name: source_column
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/build-datasets
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            ARGS="$ARGS --input-file {{inputs.parameters.input_file}} --text-column {{inputs.parameters.text_column}}"
            [ -n "{{inputs.parameters.shop_column}}" ]   && ARGS="$ARGS --shop-column {{inputs.parameters.shop_column}}"
            [ -n "{{inputs.parameters.budget_column}}" ] && ARGS="$ARGS --budget-column {{inputs.parameters.budget_column}}"
            [ -n "{{inputs.parameters.annee_column}}" ]  && ARGS="$ARGS --annee-column {{inputs.parameters.annee_column}}"
            [ -n "{{inputs.parameters.source_column}}" ] && ARGS="$ARGS --source-column {{inputs.parameters.source_column}}"
            # Étiquettes du fichier d'entrée : ce sont elles qui rendent le run évaluable.
            [ -n "{{inputs.parameters.label-column}}" ]  && ARGS="$ARGS --label-column {{inputs.parameters.label-column}}"
            uv run --locked --no-dev main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 0b: Codification par regex
    # -----------------------------------------------------------------------
    - name: classify-regex
      inputs:
        parameters:
          # Passé par le DAG et non lu en portée workflow : c'est ce qui permet
          # à la passe smoke de coder 100 lignes et à la passe réelle de tout coder.
          - name: sample-observations
          - name: run_id
          - name: run_date
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-regex
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file non vide => mode production (train=annotations_full, test=observations)
            ARGS="$ARGS --input-file {{workflow.parameters.input_file}}"
            # Sampling CENTRALISÉ du jeu à coder (unique point du pipeline) :
            # tous les classifieurs aval héritent de ce tirage.
            [ -n "{{inputs.parameters.sample-observations}}" ] && ARGS="$ARGS --sample-size {{inputs.parameters.sample-observations}}"
            uv run --locked --no-dev src/main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
