          - name: annee_column
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/export-results
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # Quelle conciliation a produit le code final. Le chemin du parquet
            # en est déduit côté Python : une seule source de vérité.
            ARGS="$ARGS --decision-source {{inputs.parameters.reconciliation}}"
            [ -n "{{inputs.parameters.text_column}}" ]   && ARGS="$ARGS --text-column {{inputs.parameters.text_column}}"
            [ -n "{{inputs.parameters.shop_column}}" ]   && ARGS="$ARGS --shop-column {{inputs.parameters.shop_column}}"
            [ -n "{{inputs.parameters.budget_column}}" ] && ARGS="$ARGS --budget-column {{inputs.parameters.budget_column}}"
            [ -n "{{inputs.parameters.annee_column}}" ]  && ARGS="$ARGS --annee-column {{inputs.parameters.annee_column}}"
            # input_file non vide => mode production : colonnes utilisateur depuis observations.parquet
            ARGS="$ARGS --input-file {{workflow.parameters.input_file}}"
            uv run --locked --no-dev main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
          limits:
            memory: 8Gi
            cpu: 2000m

    # -----------------------------------------------------------------------
    # Step 7 (opt-in): accuracy report (Quarto HTML on S3)
    # -----------------------------------------------------------------------
    - name: report
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: report-experiment
          - name: classify-rag-model
          - name: reconcile-llm-model
          - name: reconcile-llm-concurrency
          - name: classify-ttc-model-uri
          - name: classify-rag-notices-collection
          - name: classify-rag-annotations-collection
          - name: sample-observations
          - name: skip-report
          - name: reconciliation
          - name: reconcile-sirus-model-uri
          - name: step-timings
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/report
            uv sync --locked --no-dev

            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}} \
                  --experiment-name {{inputs.parameters.report-experiment}} \
                  --reconcile-llm-model {{inputs.parameters.reconcile-llm-model}} \
                  --reconcile-llm-concurrency {{inputs.parameters.reconcile-llm-concurrency}} \
                  --classify-rag-notices-collection {{inputs.parameters.classify-rag-notices-collection}} \
                  --classify-rag-annotations-collection {{inputs.parameters.classify-rag-annotations-collection}} \
                  --skip-report {{inputs.parameters.skip-report}}"

            ARGS="$ARGS --input-file {{inputs.parameters.input_file}}"
            # Même échantillon que celui tiré par classify-regex.
            [ -n "{{inputs.parameters.sample-observations}}" ] && ARGS="$ARGS --sample-size {{inputs.parameters.sample-observations}}"
            [ -n "{{inputs.parameters.classify-rag-model}}" ]    && ARGS="$ARGS --classify-rag-model {{inputs.parameters.classify-rag-model}}"
            [ -n "{{inputs.parameters.classify-ttc-model-uri}}" ] && ARGS="$ARGS --classify-ttc-model-uri {{inputs.parameters.classify-ttc-model-uri}}"
            # Détermine quel parquet de conciliation le rapport lit.
            ARGS="$ARGS --reconciliation {{inputs.parameters.reconciliation}}"
            [ -n "{{inputs.parameters.reconcile-sirus-model-uri}}" ] && ARGS="$ARGS --reconcile-sirus-model-uri {{inputs.parameters.reconcile-sirus-model-uri}}"

            # step-timings is JSON (spaces/newlines): pass it directly with literal
            # single quotes so it stays one argument (it must NOT go through $ARGS,
            # which would word-split it on expansion).
            uv run --locked --no-dev main.py $ARGS --step-timings '{{inputs.parameters.step-timings}}'
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 20Gi
            cpu: 4000m

    # -------------------------------------------------------------------------
    # evaluate — mesure la qualité d'un run étiqueté.
    #
    # Elle lit trois artefacts, et pas seulement le parquet de conciliation :
    # celui-ci ignore les lignes codées par la regex, qui n'entrent jamais dans
    # la chaîne. Le livrable final est le seul à porter l'accuracy de bout en
    # bout — le chiffre métier.
    # -------------------------------------------------------------------------
    - name: evaluate
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: reconciliation
          - name: eval-source-column
          - name: eval-experiment
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/evaluate
            uv sync --locked --no-dev

            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}} \
                  --experiment-name {{inputs.parameters.eval-experiment}} \
                  --reconciliation {{inputs.parameters.reconciliation}} \
                  --input-file {{inputs.parameters.input_file}}"

            # Vide => la ventilation par provenance est omise du rapport.
            [ -n "{{inputs.parameters.eval-source-column}}" ] && ARGS="$ARGS --source-column {{inputs.parameters.eval-source-column}}"

            uv run --locked --no-dev main.py $ARGS
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
