          - name: skip-vector-db
          - name: skip-report
          - name: step-timings
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/report
            uv sync

            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}} \
                  --experiment-name {{inputs.parameters.experiment-name}} \
                  --decide-model {{inputs.parameters.decide-model}} \
                  --decide-concurrency {{inputs.parameters.decide-concurrency}} \
                  --skip-vector-db {{inputs.parameters.skip-vector-db}} \
                  --skip-report {{inputs.parameters.skip-report}}"

            [ -n "{{inputs.parameters.input_file}}" ]    && ARGS="$ARGS --input-file {{inputs.parameters.input_file}}"
            # Échantillon observations (pour le rapport) : sample-observations en prod, sample-annotations en éval.
            SAMPLE_OBS="{{workflow.parameters.sample-observations}}"
            [ -z "{{workflow.parameters.input_file}}" ] && SAMPLE_OBS="{{workflow.parameters.sample-annotations}}"
            [ -n "$SAMPLE_OBS" ]                         && ARGS="$ARGS --sample-size $SAMPLE_OBS"
            [ -n "{{inputs.parameters.model-name}}" ]    && ARGS="$ARGS --model-name {{inputs.parameters.model-name}}"
            [ -n "{{inputs.parameters.ttc-model-uri}}" ] && ARGS="$ARGS --ttc-model-uri {{inputs.parameters.ttc-model-uri}}"

            # step-timings is JSON (spaces/newlines): pass it directly with literal
            # single quotes so it stays one argument (it must NOT go through $ARGS,
            # which would word-split it on expansion).
            uv run main.py $ARGS --step-timings '{{inputs.parameters.step-timings}}'
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
