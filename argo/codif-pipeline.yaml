    # -----------------------------------------------------------------------
    # Step 3bis: Run the annotation-RAG (production mode — predictions only)
    # -----------------------------------------------------------------------
    - name: run-rag-annotations
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: model-name
          - name: sample-annotations
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/coicop-rag-annotations
            mkdir -p logs

            ARGS="--config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"

            # input_file vide => évaluation (--skip-eval false, calcule les métriques) ;
            # non vide => production (--skip-eval true, prédictions seules, pas de filtre source)
            SKIP_EVAL=true
            [ -z "{{workflow.parameters.input_file}}" ] && SKIP_EVAL=false
            ARGS="$ARGS --skip-eval $SKIP_EVAL"

            # Échantillonnage centralisé en amont (codif-regex) → pas de sampling ici.
            if [ -n "{{inputs.parameters.model-name}}" ]; then
              ARGS="$ARGS --model_name {{inputs.parameters.model-name}}"
            fi
            # sample-annotations non vide → collection Qdrant de test (suffix _test).
            [ -n "{{inputs.parameters.sample-annotations}}" ] && ARGS="$ARGS --sample-annotations {{inputs.parameters.sample-annotations}}"

            uv run scripts/1_run_rag.py $ARGS
