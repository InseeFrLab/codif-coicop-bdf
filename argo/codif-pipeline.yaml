    # -----------------------------------------------------------------------
    - name: decide-coicop
      inputs:
        parameters:
          - name: model
          - name: concurrency
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/coicop-bdf-classifier
            uv sync

            RUN_ROOT="s3://projet-budget-famille/data/workflow_runs/{{inputs.parameters.run_date}}/{{inputs.parameters.run_id}}"
            # Colonnes utilisateur : observations en production, split test des annotations en évaluation.
            EXTRA_COLUMNS_FILE="$RUN_ROOT/preprocessing/raw_test.parquet"
            [ -n "{{workflow.parameters.input_file}}" ] && EXTRA_COLUMNS_FILE="$RUN_ROOT/preprocessing/observations.parquet"
            ARGS="--lcs-file $RUN_ROOT/codif-lcs/raw_test_LCS.parquet \
                  --rag-file $RUN_ROOT/run-rag/predictions.parquet \
                  --rag-annotations-file $RUN_ROOT/rag-annotation/predictions.parquet \
                  --ttc-file $RUN_ROOT/run-ttc/predictions.parquet \
                  --mapping-file $RUN_ROOT/prune/mapping_lvl4.parquet \
                  --output-file $RUN_ROOT/decide-coicop/predictions.parquet \
                  --extra-columns-file $EXTRA_COLUMNS_FILE \
                  --concurrency {{inputs.parameters.concurrency}}"

            if [ -n "{{inputs.parameters.model}}" ]; then
              ARGS="$ARGS --model {{inputs.parameters.model}}"
            fi

            uv run main.py decide-coicop $ARGS
