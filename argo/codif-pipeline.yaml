apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: codif-
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  podSpecPatch: |
    containers:
      - name: main
        env:
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"

  arguments:
    parameters:
      - name: input_file
        value: s3://projet-budget-famille/data/workflow_inputs/BDF_data_tickets_appli_20260320_a_codif.csv
      - name: text_column
        value: NAT_DEP
      - name: shop_column
        value: "MAG_DEP"
      - name: budget_column
        value: "MONT_DEP"
      - name: annee_column
        value: ""
      - name: source_column
        value: ""
      # Sampling — deux curseurs :
      #   sample-annotations : plafonne la KB d'annotations (vector DB) ;
      #   sample-observations : plafonne le jeu à coder (inférence lcs/rag/rag-annotations).
      # En mode évaluation, l'inférence porte sur le split test des annotations →
      # elle utilise sample-annotations (sample-observations n'a pas de sens en éval).
      - name: sample-annotations
        value: ""
      - name: sample-observations
        value: ""
      - name: model-name
        value: "gemma4-26b-moe"
      - name: skip-vector-db
        value: "true"
      - name: run_id
        value: "{{workflow.name}}"
      - name: run_date
        value:
          "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{wor\
          kflow.creationTimestamp.d}}"
      - name: decide-model
        value: "gemma4-26b-moe"
      - name: decide-concurrency
        value: "5"
      - name: ttc-model-uri
        value: "mlflow-artifacts:/10/cacf2603514b4887bbfb77e2654c9bc1/artifacts/model"
      - name: skip-report
        value: "false"
      - name: report-experiment
        value: "codif-coicop-eval"

  templates:
    # -----------------------------------------------------------------------
    # Main pipeline: DAG with parallelism
    #
    # 4 classifieurs tournent en parallèle puis sont conciliés par decide-coicop.
    # L'étape `prune` (post codif-regex) produit TOUS les artefacts prunés
    # (nomenclature, mapping, annotations train/test, suggester) ; l'aval ne fait que lire.
    #
    #                                       ┌──→ create-vector-db ──────────────→ run-rag ──────────────┐  (les 2 vector DB
    #                    ┌──→ prune ────────┤                                                           │   sont skippables :
    #   preprocessing ──┤                   └──→ create-vector-db-annotations ──→ run-rag-annotations ──┤   skip-vector-db)
    #                    └──→ codif-regex ──┼──→ codif-lcs ──────────────────────────────────────────────┼──→ decide-coicop ──→ final-output
    #                          (→ prune)    └──→ run-ttc ───────────────────────────────────────────────┘          └──→ report  (opt-in)
    # -----------------------------------------------------------------------
    - name: pipeline
      dag:
        tasks:
          - name: preprocessing
            template: preprocessing
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"
                - name: source_column
                  value: "{{workflow.parameters.source_column}}"

          - name: codif-regex
            dependencies: [preprocessing]
            template: codif-regex
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          # Étape unifiée : produit tous les artefacts prunés (nomenclature, mapping,
          # annotations train/test, suggester). Non gated : nécessaire même sans vector DB.
          - name: prune
            dependencies: [codif-regex]
            template: prune
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: codif-lcs
            dependencies: [codif-regex]
            template: codif-lcs
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: create-vector-db
            dependencies: [prune]
            template: create-vector-db
            when: '"{{workflow.parameters.skip-vector-db}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: create-vector-db-annotations
            dependencies: [prune]
            template: create-vector-db-annotations
            when: '"{{workflow.parameters.skip-vector-db}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: run-rag
            dependencies: [create-vector-db, prune]
            template: run-rag
            arguments:
              parameters:
                - name: model-name
                  value: "{{workflow.parameters.model-name}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: run-rag-annotations
            dependencies: [create-vector-db-annotations, prune]
            template: run-rag-annotations
            arguments:
              parameters:
                - name: model-name
                  value: "{{workflow.parameters.model-name}}"
                - name: sample-annotations
                  value: "{{workflow.parameters.sample-annotations}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: run-ttc
            dependencies: [codif-regex]
            template: run-ttc
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: ttc-model-uri
                  value: "{{workflow.parameters.ttc-model-uri}}"

          - name: decide-coicop
            dependencies: [codif-lcs, run-rag, run-rag-annotations, run-ttc]
            template: decide-coicop
            arguments:
              parameters:
                - name: model
                  value: "{{workflow.parameters.decide-model}}"
                - name: concurrency
                  value: "{{workflow.parameters.decide-concurrency}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: final-output
            dependencies: [decide-coicop]
            template: final-output
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"

          - name: report
            dependencies: [preprocessing, codif-regex, codif-lcs, run-rag, run-rag-annotations, run-ttc, decide-coicop, final-output]
            template: report
            when: '"{{workflow.parameters.skip-report}}" != "true"'
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: experiment-name
                  value: "{{workflow.parameters.report-experiment}}"
                - name: model-name
                  value: "{{workflow.parameters.model-name}}"
                - name: decide-model
                  value: "{{workflow.parameters.decide-model}}"
                - name: decide-concurrency
                  value: "{{workflow.parameters.decide-concurrency}}"
                - name: ttc-model-uri
                  value: "{{workflow.parameters.ttc-model-uri}}"
                - name: skip-vector-db
                  value: "{{workflow.parameters.skip-vector-db}}"
                - name: skip-report
                  value: "{{workflow.parameters.skip-report}}"
                - name: step-timings
                  value: |
                    {"preprocessing":["{{tasks.preprocessing.startedAt}}","{{tasks.preprocessing.finishedAt}}"],
                     "codif-regex":["{{tasks.codif-regex.startedAt}}","{{tasks.codif-regex.finishedAt}}"],
                     "codif-lcs":["{{tasks.codif-lcs.startedAt}}","{{tasks.codif-lcs.finishedAt}}"],
                     "run-rag":["{{tasks.run-rag.startedAt}}","{{tasks.run-rag.finishedAt}}"],
                     "run-rag-annotations":["{{tasks.run-rag-annotations.startedAt}}","{{tasks.run-rag-annotations.finishedAt}}"],
                     "run-ttc":["{{tasks.run-ttc.startedAt}}","{{tasks.run-ttc.finishedAt}}"],
                     "decide-coicop":["{{tasks.decide-coicop.startedAt}}","{{tasks.decide-coicop.finishedAt}}"]}

    # -----------------------------------------------------------------------
    # Step 0: Preprocessing — construction du dataset
    # -----------------------------------------------------------------------
    - name: preprocessing
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: text_column
          - name: shop_column
          - name: budget_column
          - name: annee_column
          - name: source_column
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/preprocessing
            uv sync
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file vide => mode évaluation : ne pas passer --input-file ni les colonnes (sens uniquement en prédiction)
            if [ -n "{{inputs.parameters.input_file}}" ]; then
              ARGS="$ARGS --input-file {{inputs.parameters.input_file}} --text-column {{inputs.parameters.text_column}}"
              [ -n "{{inputs.parameters.shop_column}}" ]   && ARGS="$ARGS --shop-column {{inputs.parameters.shop_column}}"
              [ -n "{{inputs.parameters.budget_column}}" ] && ARGS="$ARGS --budget-column {{inputs.parameters.budget_column}}"
              [ -n "{{inputs.parameters.annee_column}}" ]  && ARGS="$ARGS --annee-column {{inputs.parameters.annee_column}}"
              [ -n "{{inputs.parameters.source_column}}" ] && ARGS="$ARGS --source-column {{inputs.parameters.source_column}}"
            fi
            uv run main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 0b: Codification par regex
    # -----------------------------------------------------------------------
    - name: codif-regex
      inputs:
        parameters:
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/regex-codif
            uv sync
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file non vide => mode production (train=annotations_full, test=observations)
            [ -n "{{workflow.parameters.input_file}}" ] && ARGS="$ARGS --input-file {{workflow.parameters.input_file}}"
            # Sampling CENTRALISÉ des observations (unique point) : sample-observations en prod,
            # sample-annotations en éval. Tous les classifieurs aval héritent de ce jeu.
            SAMPLE_OBS="{{workflow.parameters.sample-observations}}"
            [ -z "{{workflow.parameters.input_file}}" ] && SAMPLE_OBS="{{workflow.parameters.sample-annotations}}"
            [ -n "$SAMPLE_OBS" ] && ARGS="$ARGS --sample-size $SAMPLE_OBS"
            uv run src/main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 0c: Codification par LCS
    # -----------------------------------------------------------------------
    - name: codif-lcs
      inputs:
        parameters:
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-r-python-julia:r4.5.3-py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/stats-annotations
            # Échantillonnage centralisé en amont (codif-regex) → pas de sampling ici.
            ARGS="--run-id={{inputs.parameters.run_id}} --run-date={{inputs.parameters.run_date}}"
            Rscript R/main.R $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 1: Pruning unifié — nomenclature + mapping + annotations train/test + suggester
    # -----------------------------------------------------------------------
    - name: prune
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/prune
            uv sync
            uv run scripts/main.py --config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 2b: Create vector database
    # -----------------------------------------------------------------------
    - name: create-vector-db
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/coicop-rag
            uv run scripts/0_create_vector_db.py --config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
          - name: LLMLAB_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_URL
          - name: LLMLAB_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_API_KEY
          - name: QDRANT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_URL
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_KEY
          - name: QDRANT_API_PORT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_PORT
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 3: Run RAG pipeline
    # -----------------------------------------------------------------------
    - name: run-rag
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: model-name
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/coicop-rag
            mkdir -p logs prompts

            ARGS="--config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"

            # Échantillonnage centralisé en amont (codif-regex) → pas de sampling ici.
            if [ -n "{{inputs.parameters.model-name}}" ]; then
              ARGS="$ARGS --model_name {{inputs.parameters.model-name}}"
            fi

            uv run scripts/2_run_rag.py $ARGS
        env:
          - name: LANGFUSE_BASE_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LANGFUSE_BASE_URL
          - name: LANGFUSE_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LANGFUSE_PUBLIC_KEY
          - name: LANGFUSE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LANGFUSE_SECRET_KEY
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: LLMLAB_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_API_KEY
          - name: LLMLAB_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_URL
          - name: QDRANT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_URL
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_KEY
          - name: QDRANT_API_PORT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_PORT
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Step 2bis: Build the annotation vector DB (RAG on annotated examples)
    # -----------------------------------------------------------------------
    - name: create-vector-db-annotations
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/coicop-rag-annotations
            # input_file vide => évaluation (skip-eval=false) ; non vide => production (skip-eval=true)
            SKIP_EVAL=true
            [ -z "{{workflow.parameters.input_file}}" ] && SKIP_EVAL=false
            BUILD_ARGS="--config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}} --skip-eval $SKIP_EVAL"
            # Échantillon de la KB d'annotations indexée dans la vector DB.
            [ -n "{{workflow.parameters.sample-annotations}}" ] && BUILD_ARGS="$BUILD_ARGS --sample-size {{workflow.parameters.sample-annotations}}"
            uv run scripts/0_build_annotation_vector_db.py $BUILD_ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
