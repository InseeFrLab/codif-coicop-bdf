    #
    # Python pur : le modèle est une liste de règles en JSON, et le scoring une
    # moyenne. Aucune étape du pipeline n'installe ni ne compile le paquet R
    # `sirus` — seul l'entraînement en a besoin, et il se fait hors pipeline
    # (`reconcile-sirus/train.sh`, cf. reconcile-sirus/README.md).
    # -----------------------------------------------------------------------
    - name: reconcile-sirus
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: reconcile-sirus-model-uri
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/reconcile-sirus
            uv sync --locked --no-dev

            RUN_ROOT="s3://projet-budget-famille/data/workflow_runs/{{inputs.parameters.run_date}}/{{inputs.parameters.run_id}}"
            # Colonnes utilisateur : observations en production, split test des
            # annotations en évaluation (même règle que reconcile-llm).
            EXTRA_COLUMNS_FILE="$RUN_ROOT/build-datasets/raw_test.parquet"
            [ -n "{{workflow.parameters.input_file}}" ] && EXTRA_COLUMNS_FILE="$RUN_ROOT/build-datasets/observations.parquet"

            # Attention : le dossier de RAG-annotations est `classify-rag-annotations`
            # (singulier), contrairement au nom de l'étape.
            ARGS="--lcs-file $RUN_ROOT/classify-lcs/raw_test_LCS.parquet \
                  --rag-file $RUN_ROOT/classify-rag-notices/predictions.parquet \
                  --rag-annotations-file $RUN_ROOT/classify-rag-annotations/predictions.parquet \
                  --ttc-file $RUN_ROOT/classify-ttc/predictions.parquet \
                  --mapping-file $RUN_ROOT/prune-codes/mapping_lvl4.parquet \
                  --tocodify-file $RUN_ROOT/classify-regex/raw_test_without_regex.parquet \
                  --extra-columns-file $EXTRA_COLUMNS_FILE \
                  --model-uri {{inputs.parameters.reconcile-sirus-model-uri}} \
                  --output-file $RUN_ROOT/reconcile-sirus/predictions.parquet"

            uv run --locked --no-dev main.py predict $ARGS
        env:
          # MLFLOW_* : nécessaires pour résoudre reconcile-sirus-model-uri.
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
