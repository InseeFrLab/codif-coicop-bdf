    # -----------------------------------------------------------------------
    - name: run-ttc
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: ttc-model-uri
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [ sh, -c ]
        args:
          - |
            set -e
            git clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo && cd repo/coicop-bdf-classifier
            uv sync

            RUN_ROOT="s3://projet-budget-famille/data/workflow_runs/{{inputs.parameters.run_date}}/{{inputs.parameters.run_id}}"
            # Échantillonnage centralisé en amont (codif-regex) → pas de sampling ici.
            uv run main.py predict-basic \
              --model "{{inputs.parameters.ttc-model-uri}}" \
              --file "$RUN_ROOT/codif-regex/raw_test_without_regex.parquet" \
              --output "$RUN_ROOT/run-ttc/predictions.parquet" \
