# Entraînement du classifieur TTC basique, puis évaluation du modèle obtenu.
#
#   build-datasets → classify-regex → prune-codes → resolve-inputs ─┐
#   train (GPU, en parallèle dès le départ) ────────────────────────┴─→ evaluate-base
#                                                                   └─→ fine-tune (GPU) → evaluate-fine-tuned
#
# Les entrées de l'évaluation et du fine-tuning sont RECONSTRUITES par les mêmes
# étapes que codif-pipeline, sur `input_file` (fichier étiqueté, `label-column`) :
# build-datasets, classify-regex et prune-codes sont des copies conformes de leurs
# templates dans codif-pipeline.yaml (vérifié par scripts/check_pipeline.py) et
# écrivent sous workflow_runs/{run_date}/{run_id}/ comme un run de codification.
# `resolve-inputs` y lit ensuite, par contracts.yaml (entrée `train-ttc`) :
#   - évaluation  : classify-regex/raw_test_without_regex.parquet — le fichier
#                   d'entrée (ex. annotations vague 1 2026) moins ce que la regex a
#                   codé : exactement ce que classify-ttc code dans le pipeline ;
#   - fine-tuning : build-datasets/annotations_full.parquet — les anciennes
#                   annotations (BdF 2017, suggester, BdF 2024), la KB de
#                   rag-annotations ; construit sans `input_file` ;
#   - vérité      : prune-codes/mapping_lvl4.parquet — vérité et prédictions
#                   tronquées au niveau 4 puis élaguées (code_lvl4), comme `evaluate`.
#
# - `train` lance `classify-ttc/main.py train-basic` sur un jeu d'entraînement
#   paramétrable (sortie de `build-training-data`), tous les paramètres de la
#   commande étant exposés ci-dessous.
# - `predict-evaluate` prédit avec CE modèle sur un parquet S3 étiqueté, puis
#   produit le rapport d'évaluation : en texte dans la log, en texte et en HTML
#   sous `output-prefix/base/`.
# - `fine-tune` (si `fine-tune=true`) fine-tune ce modèle sur les annotations,
#   en parallèle de `evaluate-base`, dans une expérience MLflow distincte ;
#   `evaluate-fine-tuned` l'évalue sur le même jeu, sous `output-prefix/fine-tuned/`.
#
# Passage du modèle d'un pod à l'autre : par MLflow. L'étape `train` crée elle-même
# le run MLflow (nommé d'après le workflow) et le passe à train-basic par
# `MLFLOW_RUN_ID` : `mlflow.start_run()` reprend alors ce run au lieu d'en créer
# un. L'URI `runs:/<run_id>/model` est donc connue sans rien lire après coup —
# chercher « le dernier run de l'expérience » confondrait deux entraînements
# lancés en parallèle.
#
# Hors pipeline de codification, comme l'entraînement de reconcile-sirus : le
# modèle retenu se recopie ensuite à la main dans `classify-ttc-model-uri`
# (argo/params.yaml).
#
#   argo submit argo/train-ttc-pipeline.yaml --watch
#   argo submit argo/train-ttc-pipeline.yaml -p git-branch=ma-branche -p num-epochs=1 \
#     -p fine-tune=false -p sample-observations=1000 --watch
#
# `git -c http.version=HTTP/1.1` sur tous les clones : NE PAS RETIRER (voir
# codif-pipeline.yaml : le git de l'image échoue sur la réponse HTTP/2 de GitHub).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: train-ttc-
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  podSpecPatch: |
    containers:
      - name: main
        env:
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"

  arguments:
    parameters:
      # Chaque étape clone le dépôt à cette branche : pousser avant de lancer.
      - name: git-branch
        value: ttc-new-train

      # --- Fichier étiqueté et construction des entrées ------------------------
      # Mêmes noms que dans codif-pipeline.yaml : les templates copiés
      # (build-datasets, classify-regex, prune-codes) les lisent tels quels.
      # Défauts : la configuration étiquetée de argo/params.yaml.
      - name: input_file
        value: s3://projet-budget-famille/data/annotations_vague1_2026/as_new_input/annotations_vague1_2026_a_codif.parquet
      # Colonne de vérité du fichier d'entrée, recopiée dans `code`. Obligatoire.
      - name: label-column
        value: code_previous
      - name: text_column
        value: NAT_DEP
      - name: shop_column
        value: MAG_DEP
      - name: budget_column
        value: MONT_DEP
      - name: annee_column
        value: ""
      - name: source_column
        value: ""
      # Échantillon du jeu à évaluer, tiré par classify-regex. Vide = tout.
      - name: sample-observations
        value: ""
      # Racine des fichiers construits : workflow_runs/{run_date}/{run_id}/.
      - name: run_id
        value: "{{workflow.name}}"
      - name: run_date
        value:
          "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{wor\
          kflow.creationTimestamp.d}}"

      # --- Entraînement (train-basic) ---------------------------------------
      - name: train-data
        value: s3://projet-budget-famille/data/ddc_raw/ddc_train_20260930-full.parquet
      # "true" : le jeu est chiffré avec DDC_ENCRYPTION_KEY (cas de build-training-data
      # lancé avec --encryption-key).
      - name: encrypted
        value: "true"
        enum: ["true", "false"]
      # code8 = code de niveau 4 (98/99 compris) : cible du modèle.
      - name: code-column
        value: code8
      - name: text-column
        value: product
      # build-training-data a déjà nettoyé le texte.
      - name: preprocess
        value: "false"
        enum: ["true", "false"]
      - name: ngram-min
        value: "3"
      - name: ngram-max
        value: "6"
      - name: ngram-vocab-size
        value: "100000"
      - name: embedding-dim
        value: "128"
      - name: max-seq-length
        value: "64"
      # 256 et non 32 (défaut de la CLI) : un lot de 32 laisse la GPU presque vide.
      - name: batch-size
        value: "256"
      - name: lr
        value: "0.1"
      - name: num-epochs
        value: "200"
      - name: patience
        value: "5"
      # Vide = tokenizer n-grammes ; sinon nom HuggingFace (ex. camembert-base).
      - name: tokenizer
        value: ""
      - name: mlflow-experiment
        value: codif-coicop-ttc-train
      # Évaluation intégrée à train-basic, loggée dans MLflow. Vide = désactivée
      # (l'étape predict-evaluate fait l'évaluation de référence).
      - name: train-eval-data
        value: ""
      - name: train-eval-text-column
        value: product
      - name: train-eval-code-column
        value: code
      - name: train-eval-top-k
        value: "5"
      # Colonnes booléennes séparées par des espaces (ex. "from_app is_ddc").
      - name: train-eval-filter-columns
        value: ""

      # --- Fine-tuning (fine-tune-basic) ------------------------------------------
      # "false" : fine-tune et evaluate-fine-tuned sont sautées.
      - name: fine-tune
        value: "true"
        enum: ["true", "false"]
      - name: ft-text-column
        value: l_pr_product
      - name: ft-code-column
        value: code
      # Troncature des codes avant fine-tuning : 4 = niveau de code8, la cible du
      # modèle. Seuls les codes déjà connus du modèle sont gardés.
      - name: ft-code-level
        value: "4"
      # Données annotées brutes : prétraitement à appliquer.
      - name: ft-preprocess
        value: "true"
        enum: ["true", "false"]
      - name: ft-encrypted
        value: "false"
        enum: ["true", "false"]
      # Vides = défauts de fine-tune-basic : lr d'origine / 10, 5 epochs,
      # batch d'origine, patience 3.
      - name: ft-lr
        value: ""
      - name: ft-num-epochs
        value: ""
      - name: ft-batch-size
        value: ""
      - name: ft-patience
        value: ""
      # Expérience distincte de mlflow-experiment (vérifié au lancement).
      - name: ft-mlflow-experiment
        value: codif-coicop-ttc-finetune

      # --- Prédiction et évaluation ---------------------------------------------
      - name: eval-text-column
        value: l_pr_product
      - name: eval-code-column
        value: code
      # Colonne de ventilation du rapport (ex. source). Vide = aucune.
      - name: eval-category-column
        value: ""
      - name: top-k
        value: "10"
      - name: max-k
        value: "5"
      # Reçoit base/ et fine-tuned/, chacun avec predictions.parquet,
      # evaluation_report.txt et evaluation_report.html.
      - name: output-prefix
        value: "s3://projet-budget-famille/data/workflow_outputs/train-ttc/{{workflow.name}}"

  templates:
    - name: pipeline
      dag:
        tasks:
          # Construction des entrées, comme dans codif-pipeline.
          - name: build-datasets
            template: build-datasets
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: label-column
                  value: "{{workflow.parameters.label-column}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"
                - name: source_column
                  value: "{{workflow.parameters.source_column}}"
          - name: classify-regex
            dependencies: [build-datasets]
            template: classify-regex
            arguments:
              parameters:
                - name: sample-observations
                  value: "{{workflow.parameters.sample-observations}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
          - name: prune-codes
            dependencies: [classify-regex]
            template: prune-codes
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
          - name: resolve-inputs
            dependencies: [prune-codes]
            template: resolve-inputs
          # L'entraînement ne dépend pas de ces fichiers : il démarre tout de suite.
          - name: train
            template: train
          - name: evaluate-base
            dependencies: [train, resolve-inputs]
            template: predict-evaluate
            arguments:
              parameters:
                - name: model-uri
                  value: "{{tasks.train.outputs.parameters.model-uri}}"
                - name: variant
                  value: base
                - name: eval-file
                  value: "{{tasks.resolve-inputs.outputs.parameters.eval-file}}"
                - name: mapping-file
                  value: "{{tasks.resolve-inputs.outputs.parameters.mapping-file}}"
                - name: ft-data
                  value: "{{tasks.resolve-inputs.outputs.parameters.ft-data}}"
          - name: fine-tune
            dependencies: [train, resolve-inputs]
            template: fine-tune
            when: '"{{workflow.parameters.fine-tune}}" == "true"'
            arguments:
              parameters:
                - name: base-model-uri
                  value: "{{tasks.train.outputs.parameters.model-uri}}"
                - name: ft-data
                  value: "{{tasks.resolve-inputs.outputs.parameters.ft-data}}"
          # Même `when` que fine-tune : `dependencies:` accepte une tâche Skipped,
          # et cette étape partirait alors sans modèle.
          - name: evaluate-fine-tuned
            dependencies: [fine-tune]
            template: predict-evaluate
            when: '"{{workflow.parameters.fine-tune}}" == "true"'
            arguments:
              parameters:
                - name: model-uri
                  value: "{{tasks.fine-tune.outputs.parameters.model-uri}}"
                - name: variant
                  value: fine-tuned
                - name: eval-file
                  value: "{{tasks.resolve-inputs.outputs.parameters.eval-file}}"
                - name: mapping-file
                  value: "{{tasks.resolve-inputs.outputs.parameters.mapping-file}}"
                - name: ft-data
                  value: "{{tasks.resolve-inputs.outputs.parameters.ft-data}}"

    # -------------------------------------------------------------------------
    # build-datasets, classify-regex, prune-codes — COPIES CONFORMES des templates
    # de codif-pipeline.yaml : ne pas modifier ici. scripts/check_pipeline.py
    # échoue si elles divergent ; modifier l'original puis recopier.
    # -------------------------------------------------------------------------
    - name: build-datasets
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: label-column
          - name: text_column
          - name: shop_column
          - name: budget_column
          - name: annee_column
          - name: source_column
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/build-datasets
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            ARGS="$ARGS --input-file {{inputs.parameters.input_file}} --text-column {{inputs.parameters.text_column}}"
            [ -n "{{inputs.parameters.shop_column}}" ]   && ARGS="$ARGS --shop-column {{inputs.parameters.shop_column}}"
            [ -n "{{inputs.parameters.budget_column}}" ] && ARGS="$ARGS --budget-column {{inputs.parameters.budget_column}}"
            [ -n "{{inputs.parameters.annee_column}}" ]  && ARGS="$ARGS --annee-column {{inputs.parameters.annee_column}}"
            [ -n "{{inputs.parameters.source_column}}" ] && ARGS="$ARGS --source-column {{inputs.parameters.source_column}}"
            # Étiquettes du fichier d'entrée : ce sont elles qui rendent le run évaluable.
            [ -n "{{inputs.parameters.label-column}}" ]  && ARGS="$ARGS --label-column {{inputs.parameters.label-column}}"
            uv run --locked --no-dev main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    - name: classify-regex
      inputs:
        parameters:
          # Passé par le DAG et non lu en portée workflow : c'est ce qui permet
          # à la passe smoke de coder 100 lignes et à la passe réelle de tout coder.
          - name: sample-observations
          - name: run_id
          - name: run_date
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-regex
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file non vide => mode production (train=annotations_full, test=observations)
            ARGS="$ARGS --input-file {{workflow.parameters.input_file}}"
            # Sampling CENTRALISÉ du jeu à coder (unique point du pipeline) :
            # tous les classifieurs aval héritent de ce tirage.
            [ -n "{{inputs.parameters.sample-observations}}" ] && ARGS="$ARGS --sample-size {{inputs.parameters.sample-observations}}"
            uv run --locked --no-dev src/main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    - name: prune-codes
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/prune-codes
            uv sync --locked --no-dev
            uv run --locked --no-dev scripts/main.py --config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m
    # Step 3: Run RAG pipeline

    # -------------------------------------------------------------------------
    # resolve-inputs — CPU, après prune-codes. Résout les fichiers construits par
    # ce workflow via contracts.yaml (jamais de chemin reconstruit à la main) et
    # vérifie qu'ils sont lisibles, portent les colonnes attendues et que le jeu
    # d'évaluation a des étiquettes.
    # -------------------------------------------------------------------------
    - name: resolve-inputs
      outputs:
        parameters:
          - name: eval-file
            valueFrom:
              path: /tmp/eval-file
          - name: ft-data
            valueFrom:
              path: /tmp/ft-data
          - name: mapping-file
            valueFrom:
              path: /tmp/mapping-file
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            # Sans étiquettes, rien à mesurer.
            if [ -z "{{workflow.parameters.label-column}}" ]; then
              echo "ERREUR : label-column est vide : input_file doit porter une colonne d'étiquettes."
              exit 1
            fi
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            export RUN_DATE="{{workflow.parameters.run_date}}"
            export RUN_ID="{{workflow.parameters.run_id}}"
            export EVAL_TEXT="{{workflow.parameters.eval-text-column}}"
            export EVAL_CODE="{{workflow.parameters.eval-code-column}}"
            export FT_TEXT="{{workflow.parameters.ft-text-column}}"
            export FT_CODE="{{workflow.parameters.ft-code-column}}"
            export FINE_TUNE="{{workflow.parameters.fine-tune}}"
            uv run --locked --no-dev python - <<'EOF'
            import os
            import sys

            import duckdb
            from codif_common.contracts import artifact
            from src.preprocessing.data_preparation import configure_s3

            run = {"run_date": os.environ["RUN_DATE"], "run_id": os.environ["RUN_ID"]}
            paths = {
                "eval-file": artifact("classify-regex", "test_without_regex", **run),
                "ft-data": artifact("build-datasets", "annotations_full", **run),
                "mapping-file": artifact("prune-codes", "mapping_lvl4", **run),
            }
            con = duckdb.connect()
            configure_s3(con)

            def check(name, columns):
                path = paths[name]
                try:
                    found = set(con.execute(f"DESCRIBE SELECT * FROM '{path}'").df()["column_name"])
                except Exception as exc:
                    sys.exit(f"[resolve-inputs] {name} illisible : {path}\n  {exc}")
                missing = [c for c in columns if c not in found]
                if missing:
                    sys.exit(f"[resolve-inputs] {name} ({path}) : colonnes absentes {missing}")
                n = con.execute(f"SELECT count(*) FROM '{path}'").fetchone()[0]
                print(f"[resolve-inputs] {name:12s} {n:>9,} lignes  {path}")
                return path

            eval_file = check("eval-file", [os.environ["EVAL_TEXT"], os.environ["EVAL_CODE"]])
            code = os.environ["EVAL_CODE"]
            n_labels = con.execute(
                f"SELECT count(*) FROM '{eval_file}' WHERE nullif(trim(CAST(\"{code}\" AS VARCHAR)), '') IS NOT NULL"
            ).fetchone()[0]
            if n_labels == 0:
                sys.exit(f"[resolve-inputs] aucune étiquette dans « {code} » : label-column désigne-t-il la bonne colonne de input_file ?")
            print(f"[resolve-inputs] étiquettes {n_labels:>9,}")
            check("mapping-file", ["code", "code_parent_equivalent"])
            if os.environ["FINE_TUNE"] == "true":
                check("ft-data", [os.environ["FT_TEXT"], os.environ["FT_CODE"]])
                if paths["ft-data"] == eval_file:
                    sys.exit("[resolve-inputs] ft-data = jeu d'évaluation : le modèle serait évalué sur ses données de fine-tuning")

            for name, path in paths.items():
                with open(f"/tmp/{name}", "w") as f:
                    f.write(path)
            EOF
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 4Gi
            cpu: 2000m

    # -------------------------------------------------------------------------
    # train — GPU. torchTextClassifiers choisit cuda tout seul (accelerator="auto") ;
    # les wheels torch du lock embarquent CUDA, l'image python standard suffit.
    # -------------------------------------------------------------------------
    - name: train
      outputs:
        parameters:
          - name: model-uri
            valueFrom:
              path: /tmp/model_uri
      container:
        image: inseefrlab/onyxia-python-pytorch:py3.13.12-gpu
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            uv run --locked --no-dev python -c "import torch; print('[train] CUDA disponible :', torch.cuda.is_available())"

            # Run MLflow créé ici, repris par train-basic via MLFLOW_RUN_ID.
            # L'expérience doit être la même des deux côtés, sinon MLflow refuse la reprise.
            RUN_ID=$(uv run --locked --no-dev python -c "
            import mlflow
            from mlflow import MlflowClient
            exp = mlflow.set_experiment('{{workflow.parameters.mlflow-experiment}}')
            run = MlflowClient().create_run(
                exp.experiment_id,
                run_name='{{workflow.name}}',
                tags={'argo_workflow': '{{workflow.name}}'},
            )
            print(run.info.run_id)
            " | tail -n 1)
            # `set -e` ne voit que le statut de `tail` : on vérifie le résultat.
            if [ -z "$RUN_ID" ]; then echo "[train] création du run MLflow impossible" >&2; exit 1; fi
            echo "[train] run MLflow : $RUN_ID"

            # Un échec laisserait le run en RUNNING : on le marque FAILED en sortant.
            mark_failed() {
              uv run --locked --no-dev python -c "from mlflow import MlflowClient; MlflowClient().set_terminated('$RUN_ID', 'FAILED')" || true
            }
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then mark_failed; fi; exit $rc' EXIT

            ARGS="--data {{workflow.parameters.train-data}} \
                  --code-column {{workflow.parameters.code-column}} \
                  --text-column {{workflow.parameters.text-column}} \
                  --output /tmp/ttc \
                  --ngram-min {{workflow.parameters.ngram-min}} \
                  --ngram-max {{workflow.parameters.ngram-max}} \
                  --ngram-vocab-size {{workflow.parameters.ngram-vocab-size}} \
                  --embedding-dim {{workflow.parameters.embedding-dim}} \
                  --max-seq-length {{workflow.parameters.max-seq-length}} \
                  --batch-size {{workflow.parameters.batch-size}} \
                  --lr {{workflow.parameters.lr}} \
                  --num-epochs {{workflow.parameters.num-epochs}} \
                  --patience {{workflow.parameters.patience}} \
                  --mlflow-experiment {{workflow.parameters.mlflow-experiment}}"
            if [ "{{workflow.parameters.preprocess}}" = "true" ]; then ARGS="$ARGS --preprocess"; fi
            if [ -n "{{workflow.parameters.tokenizer}}" ]; then ARGS="$ARGS --tokenizer {{workflow.parameters.tokenizer}}"; fi
            if [ -n "{{workflow.parameters.train-eval-data}}" ]; then
              ARGS="$ARGS --eval-data {{workflow.parameters.train-eval-data}} \
                    --eval-text-column {{workflow.parameters.train-eval-text-column}} \
                    --eval-code-column {{workflow.parameters.train-eval-code-column}} \
                    --eval-top-k {{workflow.parameters.train-eval-top-k}}"
              if [ -n "{{workflow.parameters.train-eval-filter-columns}}" ]; then
                ARGS="$ARGS --eval-filter-columns {{workflow.parameters.train-eval-filter-columns}}"
              fi
            fi
            # La clé est ajoutée à part, et n'est jamais affichée.
            if [ "{{workflow.parameters.encrypted}}" = "true" ]; then
              ARGS="$ARGS --encryption-key $DDC_ENCRYPTION_KEY"
            fi

            MLFLOW_RUN_ID="$RUN_ID" uv run --locked --no-dev main.py train-basic $ARGS

            echo "runs:/$RUN_ID/model" > /tmp/model_uri
            echo "[train] modèle : runs:/$RUN_ID/model"
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        # Les DataLoaders (num_workers=12) passent par /dev/shm, limité à 64 Mo
        # par défaut dans un pod : sans ce volume, « bus error » au premier epoch.
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 16Gi
            cpu: 12000m
            nvidia.com/gpu: 1
      nodeSelector:
        gpu-vram: 16GB
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

    # -------------------------------------------------------------------------
    # fine-tune — GPU, mêmes réglages que train. Part du modèle de train et le
    # fine-tune sur ft-data, dans ft-mlflow-experiment (même mécanisme de run
    # MLflow créé ici puis repris via MLFLOW_RUN_ID).
    # -------------------------------------------------------------------------
    - name: fine-tune
      inputs:
        parameters:
          - name: base-model-uri
          - name: ft-data
      outputs:
        parameters:
          - name: model-uri
            valueFrom:
              path: /tmp/model_uri
      container:
        image: inseefrlab/onyxia-python-pytorch:py3.13.12-gpu
        command: [sh, -c]
        args:
          - |
            set -e
            if [ "{{workflow.parameters.ft-mlflow-experiment}}" = "{{workflow.parameters.mlflow-experiment}}" ]; then
              echo "[fine-tune] ft-mlflow-experiment doit différer de mlflow-experiment" >&2
              exit 1
            fi

            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            uv run --locked --no-dev python -c "import torch; print('[fine-tune] CUDA disponible :', torch.cuda.is_available())"

            RUN_ID=$(uv run --locked --no-dev python -c "
            import mlflow
            from mlflow import MlflowClient
            exp = mlflow.set_experiment('{{workflow.parameters.ft-mlflow-experiment}}')
            run = MlflowClient().create_run(
                exp.experiment_id,
                run_name='{{workflow.name}}',
                tags={
                    'argo_workflow': '{{workflow.name}}',
                    'base_model_uri': '{{inputs.parameters.base-model-uri}}',
                },
            )
            print(run.info.run_id)
            " | tail -n 1)
            # `set -e` ne voit que le statut de `tail` : on vérifie le résultat.
            if [ -z "$RUN_ID" ]; then echo "[fine-tune] création du run MLflow impossible" >&2; exit 1; fi
            echo "[fine-tune] run MLflow : $RUN_ID (modèle de départ : {{inputs.parameters.base-model-uri}})"

            mark_failed() {
              uv run --locked --no-dev python -c "from mlflow import MlflowClient; MlflowClient().set_terminated('$RUN_ID', 'FAILED')" || true
            }
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then mark_failed; fi; exit $rc' EXIT

            ARGS="--model {{inputs.parameters.base-model-uri}} \
                  --data {{inputs.parameters.ft-data}} \
                  --code-column {{workflow.parameters.ft-code-column}} \
                  --text-column {{workflow.parameters.ft-text-column}} \
                  --output /tmp/ttc-ft \
                  --mlflow-experiment {{workflow.parameters.ft-mlflow-experiment}}"
            if [ -n "{{workflow.parameters.ft-code-level}}" ]; then ARGS="$ARGS --code-level {{workflow.parameters.ft-code-level}}"; fi
            if [ "{{workflow.parameters.ft-preprocess}}" = "true" ]; then ARGS="$ARGS --preprocess"; fi
            if [ -n "{{workflow.parameters.ft-lr}}" ]; then ARGS="$ARGS --lr {{workflow.parameters.ft-lr}}"; fi
            if [ -n "{{workflow.parameters.ft-num-epochs}}" ]; then ARGS="$ARGS --num-epochs {{workflow.parameters.ft-num-epochs}}"; fi
            if [ -n "{{workflow.parameters.ft-batch-size}}" ]; then ARGS="$ARGS --batch-size {{workflow.parameters.ft-batch-size}}"; fi
            if [ -n "{{workflow.parameters.ft-patience}}" ]; then ARGS="$ARGS --patience {{workflow.parameters.ft-patience}}"; fi
            # La clé est ajoutée à part, et n'est jamais affichée.
            if [ "{{workflow.parameters.ft-encrypted}}" = "true" ]; then
              ARGS="$ARGS --encryption-key $DDC_ENCRYPTION_KEY"
            fi

            MLFLOW_RUN_ID="$RUN_ID" uv run --locked --no-dev main.py fine-tune-basic $ARGS

            echo "runs:/$RUN_ID/model" > /tmp/model_uri
            echo "[fine-tune] modèle : runs:/$RUN_ID/model"
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        # Les DataLoaders (num_workers=12) passent par /dev/shm, limité à 64 Mo
        # par défaut dans un pod : sans ce volume, « bus error » au premier epoch.
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 16Gi
            cpu: 12000m
            nvidia.com/gpu: 1
      nodeSelector:
        gpu-vram: 16GB
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

    # -------------------------------------------------------------------------
    # predict-evaluate — CPU. Prédit avec le modèle reçu (base ou fine-tuné), puis
    # évalue : rapport texte dans la log et sur S3, rapport HTML sur S3, sous
    # output-prefix/<variant>/.
    # -------------------------------------------------------------------------
    - name: predict-evaluate
      inputs:
        parameters:
          - name: model-uri
          - name: variant
          - name: eval-file
          - name: mapping-file
          - name: ft-data
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            PREFIX="{{workflow.parameters.output-prefix}}/{{inputs.parameters.variant}}"

            # Ligne d'en-tête propre au modèle fine-tuné (positionnels : garde les espaces).
            set --
            if [ "{{inputs.parameters.variant}}" = "fine-tuned" ]; then
              set -- --report-meta "Données de fine-tuning={{inputs.parameters.ft-data}}"
            fi

            uv run --locked --no-dev main.py predict-basic \
              --model "{{inputs.parameters.model-uri}}" \
              --file "{{inputs.parameters.eval-file}}" \
              --output "$PREFIX/predictions.parquet" \
              --text-column "{{workflow.parameters.eval-text-column}}" \
              --top-k {{workflow.parameters.top-k}}

            CATEGORY=""
            if [ -n "{{workflow.parameters.eval-category-column}}" ]; then
              CATEGORY="--category-column {{workflow.parameters.eval-category-column}}"
            fi

            # Le rapport texte part sur stdout : il est dans la log de l'étape.
            uv run --locked --no-dev main.py evaluate-predictions "$PREFIX/predictions.parquet" \
              --code-column "{{workflow.parameters.eval-code-column}}" \
              --text-column "{{workflow.parameters.eval-text-column}}" \
              --max-k {{workflow.parameters.max-k}} \
              $CATEGORY \
              --output "$PREFIX/evaluation_report.txt" \
              --html-output "$PREFIX/evaluation_report.html" \
              --mapping-file "{{inputs.parameters.mapping-file}}" \
              --report-meta "Fichier évalué (input_file)={{workflow.parameters.input_file}}" \
              --report-meta "Variante={{inputs.parameters.variant}}" \
              --report-meta "Modèle={{inputs.parameters.model-uri}}" \
              --report-meta "Jeu d'entraînement={{workflow.parameters.train-data}}" \
              --report-meta "Cible={{workflow.parameters.code-column}}" \
              --report-meta "Workflow Argo={{workflow.name}}" \
              "$@"

            echo "[predict-evaluate] modèle      : {{inputs.parameters.model-uri}}"
            echo "[predict-evaluate] prédictions : $PREFIX/predictions.parquet"
            echo "[predict-evaluate] rapport     : $PREFIX/evaluation_report.html"
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 20Gi
            cpu: 8000m
