# Entraînement d'un modèle TTC sur les SEULES anciennes annotations, pour le
# comparer aux modèles de train-ttc-pipeline.yaml (DDC + synthétique, puis fine-tuné).
#
#   build-datasets → classify-regex → prune-codes → resolve-inputs → train (GPU) → evaluate
#
# - Jeu d'entraînement : build-datasets/annotations_full.parquet — BdF 2017,
#   suggester, BdF 2024 (la KB de rag-annotations), construit sans `input_file`.
#   Codes tronqués au niveau 4 (même cible que code8), texte l_pr_product prétraité.
# - Évaluation : IDENTIQUE à train-ttc-pipeline, pour une comparaison directe —
#   même `input_file` (vague 1 2026), même tirage (classify-regex, seed 42) si
#   `sample-observations` est le même, même vérité canonique code_lvl4 et même
#   règle que l'étape `evaluate`. Rapports sous output-prefix/annotations/, ou
#   annotations-2024/ avec `pilot-2024-only=true` (sans bdf_2017 ni suggester).
# - Même architecture et mêmes hyperparamètres par défaut que train-ttc.
#
# build-datasets, classify-regex, prune-codes (de codif-pipeline.yaml) et
# resolve-inputs, predict-evaluate (de train-ttc-pipeline.yaml) sont des COPIES
# CONFORMES : scripts/check_pipeline.py échoue si elles divergent. Ici, les
# paramètres `ft-*` désignent annotations_full, qui sert de jeu d'ENTRAÎNEMENT.
#
#   argo submit argo/train-ttc-annotations-pipeline.yaml --watch
#   argo submit argo/train-ttc-annotations-pipeline.yaml -p pilot-2024-only=true --watch   # pilote 2024 seul
#
# `git -c http.version=HTTP/1.1` sur tous les clones : NE PAS RETIRER (voir
# codif-pipeline.yaml : le git de l'image échoue sur la réponse HTTP/2 de GitHub).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: train-ttc-annotations-
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  podSpecPatch: |
    containers:
      - name: main
        env:
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"

  arguments:
    parameters:
      # Chaque étape clone le dépôt à cette branche : pousser avant de lancer.
      - name: git-branch
        value: ttc-new-train

      # --- Fichier étiqueté et construction des entrées ------------------------
      # Mêmes noms et défauts que train-ttc-pipeline.yaml : garder les mêmes
      # valeurs des deux côtés pour comparer les modèles sur le même jeu.
      - name: input_file
        value: s3://projet-budget-famille/data/annotations_vague1_2026/as_new_input/annotations_vague1_2026_a_codif.parquet
      - name: label-column
        value: code_previous
      - name: text_column
        value: NAT_DEP
      - name: shop_column
        value: MAG_DEP
      - name: budget_column
        value: MONT_DEP
      - name: annee_column
        value: ""
      - name: source_column
        value: ""
      - name: sample-observations
        value: ""
      - name: run_id
        value: "{{workflow.name}}"
      - name: run_date
        value:
          "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{wor\
          kflow.creationTimestamp.d}}"

      # --- Jeu d'entraînement : annotations_full ------------------------------
      # Noms imposés par resolve-inputs (copie conforme) : ici, ft-* = colonnes de
      # annotations_full, le jeu d'entraînement ; fine-tune=true fait vérifier ce
      # fichier par resolve-inputs. Ne pas changer fine-tune.
      - name: fine-tune
        value: "true"
        enum: ["true"]
      - name: ft-text-column
        value: l_pr_product
      - name: ft-code-column
        value: code
      # "true" : entraînement sur les seules annotations du pilote 2024
      # (annotations_full sans bdf_2017 ni suggester). Rapport sous annotations-2024/.
      - name: pilot-2024-only
        value: "false"
        enum: ["true", "false"]
      # Affichés dans l'en-tête du rapport (predict-evaluate) ; non lus par train.
      # Le filtrage éventuel se lit dans la variante (annotations / annotations-2024).
      - name: train-data
        value: "build-datasets/annotations_full (anciennes annotations : BdF 2017, suggester, BdF 2024)"
      - name: code-column
        value: "code tronqué au niveau 4"

      # --- Hyperparamètres (mêmes défauts que train-ttc) -----------------------
      - name: ngram-min
        value: "3"
      - name: ngram-max
        value: "6"
      - name: ngram-vocab-size
        value: "100000"
      - name: embedding-dim
        value: "128"
      - name: max-seq-length
        value: "64"
      - name: batch-size
        value: "256"
      - name: lr
        value: "0.1"
      - name: num-epochs
        value: "200"
      - name: patience
        value: "5"
      - name: tokenizer
        value: ""
      - name: mlflow-experiment
        value: codif-coicop-ttc-annotations

      # --- Évaluation (mêmes défauts que train-ttc) ------------------------------
      - name: eval-text-column
        value: l_pr_product
      - name: eval-code-column
        value: code
      - name: eval-category-column
        value: ""
      - name: top-k
        value: "10"
      - name: max-k
        value: "5"
      - name: output-prefix
        value: "s3://projet-budget-famille/data/workflow_outputs/train-ttc-annotations/{{workflow.name}}"

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: build-datasets
            template: build-datasets
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: input_file
                  value: "{{workflow.parameters.input_file}}"
                - name: label-column
                  value: "{{workflow.parameters.label-column}}"
                - name: text_column
                  value: "{{workflow.parameters.text_column}}"
                - name: shop_column
                  value: "{{workflow.parameters.shop_column}}"
                - name: budget_column
                  value: "{{workflow.parameters.budget_column}}"
                - name: annee_column
                  value: "{{workflow.parameters.annee_column}}"
                - name: source_column
                  value: "{{workflow.parameters.source_column}}"
          - name: classify-regex
            dependencies: [build-datasets]
            template: classify-regex
            arguments:
              parameters:
                - name: sample-observations
                  value: "{{workflow.parameters.sample-observations}}"
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
          - name: prune-codes
            dependencies: [classify-regex]
            template: prune-codes
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
          - name: resolve-inputs
            dependencies: [prune-codes]
            template: resolve-inputs
          - name: train
            dependencies: [resolve-inputs]
            template: train
            arguments:
              parameters:
                - name: train-data
                  value: "{{tasks.resolve-inputs.outputs.parameters.ft-data}}"
          - name: evaluate
            dependencies: [train]
            template: predict-evaluate
            arguments:
              parameters:
                - name: model-uri
                  value: "{{tasks.train.outputs.parameters.model-uri}}"
                - name: variant
                  value: "{{tasks.train.outputs.parameters.variant}}"
                - name: eval-file
                  value: "{{tasks.resolve-inputs.outputs.parameters.eval-file}}"
                - name: mapping-file
                  value: "{{tasks.resolve-inputs.outputs.parameters.mapping-file}}"
                - name: ft-data
                  value: "{{tasks.resolve-inputs.outputs.parameters.ft-data}}"

    # -------------------------------------------------------------------------
    # train — GPU, mêmes réglages que train-ttc ; entraîne sur annotations_full.
    # -------------------------------------------------------------------------
    - name: train
      inputs:
        parameters:
          - name: train-data
      outputs:
        parameters:
          - name: model-uri
            valueFrom:
              path: /tmp/model_uri
          # Variante réellement entraînée, reprise par evaluate.
          - name: variant
            valueFrom:
              path: /tmp/variant
      container:
        image: inseefrlab/onyxia-python-pytorch:py3.13.12-gpu
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            uv run --locked --no-dev python -c "import torch; print('[train] CUDA disponible :', torch.cuda.is_available())"

            if [ "{{workflow.parameters.pilot-2024-only}}" = "true" ]; then
              TRAIN_SOURCE=annotations_pilote_2024; VARIANT=annotations-2024
            else
              TRAIN_SOURCE=annotations_full; VARIANT=annotations
            fi
            echo "$VARIANT" > /tmp/variant

            # Run MLflow créé ici, repris par train-basic via MLFLOW_RUN_ID.
            # L'expérience doit être la même des deux côtés, sinon MLflow refuse la reprise.
            RUN_ID=$(uv run --locked --no-dev python -c "
            import mlflow
            from mlflow import MlflowClient
            exp = mlflow.set_experiment('{{workflow.parameters.mlflow-experiment}}')
            run = MlflowClient().create_run(
                exp.experiment_id,
                run_name='{{workflow.name}}',
                tags={'argo_workflow': '{{workflow.name}}', 'train_source': '$TRAIN_SOURCE'},
            )
            print(run.info.run_id)
            " | tail -n 1)
            # `set -e` ne voit que le statut de `tail` : on vérifie le résultat.
            if [ -z "$RUN_ID" ]; then echo "[train] création du run MLflow impossible" >&2; exit 1; fi
            echo "[train] run MLflow : $RUN_ID"

            # Un échec laisserait le run en RUNNING : on le marque FAILED en sortant.
            mark_failed() {
              uv run --locked --no-dev python -c "from mlflow import MlflowClient; MlflowClient().set_terminated('$RUN_ID', 'FAILED')" || true
            }
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then mark_failed; fi; exit $rc' EXIT

            # annotations_full : codes à 5 niveaux, texte l_pr_product légèrement
            # normalisé → troncature au niveau 4 (cible code8 des autres modèles) et
            # prétraitement complet. Fichier de run : non chiffré, pas de clé.
            ARGS="--data {{inputs.parameters.train-data}} \
                  --text-column {{workflow.parameters.ft-text-column}} \
                  --code-column {{workflow.parameters.ft-code-column}} \
                  --code-level 4 \
                  --preprocess \
                  --output /tmp/ttc \
                  --ngram-min {{workflow.parameters.ngram-min}} \
                  --ngram-max {{workflow.parameters.ngram-max}} \
                  --ngram-vocab-size {{workflow.parameters.ngram-vocab-size}} \
                  --embedding-dim {{workflow.parameters.embedding-dim}} \
                  --max-seq-length {{workflow.parameters.max-seq-length}} \
                  --batch-size {{workflow.parameters.batch-size}} \
                  --lr {{workflow.parameters.lr}} \
                  --num-epochs {{workflow.parameters.num-epochs}} \
                  --patience {{workflow.parameters.patience}} \
                  --mlflow-experiment {{workflow.parameters.mlflow-experiment}}"
            if [ -n "{{workflow.parameters.tokenizer}}" ]; then ARGS="$ARGS --tokenizer {{workflow.parameters.tokenizer}}"; fi
            if [ "{{workflow.parameters.pilot-2024-only}}" = "true" ]; then ARGS="$ARGS --exclude-sources bdf_2017 suggester"; fi

            MLFLOW_RUN_ID="$RUN_ID" uv run --locked --no-dev main.py train-basic $ARGS

            echo "runs:/$RUN_ID/model" > /tmp/model_uri
            echo "[train] modèle : runs:/$RUN_ID/model"
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        # Les DataLoaders (num_workers=12) passent par /dev/shm, limité à 64 Mo
        # par défaut dans un pod : sans ce volume, « bus error » au premier epoch.
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 16Gi
            cpu: 12000m
            nvidia.com/gpu: 1
      nodeSelector:
        gpu-vram: 16GB
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

    # -------------------------------------------------------------------------
    # COPIES CONFORMES — ne pas modifier ici (scripts/check_pipeline.py) :
    # build-datasets, classify-regex, prune-codes ← codif-pipeline.yaml ;
    # resolve-inputs, predict-evaluate ← train-ttc-pipeline.yaml.
    # -------------------------------------------------------------------------
    - name: build-datasets
      inputs:
        parameters:
          - name: run_id
          - name: run_date
          - name: input_file
          - name: label-column
          - name: text_column
          - name: shop_column
          - name: budget_column
          - name: annee_column
          - name: source_column
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/build-datasets
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            ARGS="$ARGS --input-file {{inputs.parameters.input_file}} --text-column {{inputs.parameters.text_column}}"
            [ -n "{{inputs.parameters.shop_column}}" ]   && ARGS="$ARGS --shop-column {{inputs.parameters.shop_column}}"
            [ -n "{{inputs.parameters.budget_column}}" ] && ARGS="$ARGS --budget-column {{inputs.parameters.budget_column}}"
            [ -n "{{inputs.parameters.annee_column}}" ]  && ARGS="$ARGS --annee-column {{inputs.parameters.annee_column}}"
            [ -n "{{inputs.parameters.source_column}}" ] && ARGS="$ARGS --source-column {{inputs.parameters.source_column}}"
            # Étiquettes du fichier d'entrée : ce sont elles qui rendent le run évaluable.
            [ -n "{{inputs.parameters.label-column}}" ]  && ARGS="$ARGS --label-column {{inputs.parameters.label-column}}"
            uv run --locked --no-dev main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    - name: classify-regex
      inputs:
        parameters:
          # Passé par le DAG et non lu en portée workflow : c'est ce qui permet
          # à la passe smoke de coder 100 lignes et à la passe réelle de tout coder.
          - name: sample-observations
          - name: run_id
          - name: run_date
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-regex
            uv sync --locked --no-dev
            ARGS="--run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            # input_file non vide => mode production (train=annotations_full, test=observations)
            ARGS="$ARGS --input-file {{workflow.parameters.input_file}}"
            # Sampling CENTRALISÉ du jeu à coder (unique point du pipeline) :
            # tous les classifieurs aval héritent de ce tirage.
            [ -n "{{inputs.parameters.sample-observations}}" ] && ARGS="$ARGS --sample-size {{inputs.parameters.sample-observations}}"
            uv run --locked --no-dev src/main.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    - name: prune-codes
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
      retryStrategy:          # cf. « Reprise sur échec » en tête de fichier
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "5m"
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/prune-codes
            uv sync --locked --no-dev
            uv run --locked --no-dev scripts/main.py --config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m
    # Step 3: Run RAG pipeline

    - name: resolve-inputs
      outputs:
        parameters:
          - name: eval-file
            valueFrom:
              path: /tmp/eval-file
          - name: ft-data
            valueFrom:
              path: /tmp/ft-data
          - name: mapping-file
            valueFrom:
              path: /tmp/mapping-file
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            # Sans étiquettes, rien à mesurer.
            if [ -z "{{workflow.parameters.label-column}}" ]; then
              echo "ERREUR : label-column est vide : input_file doit porter une colonne d'étiquettes."
              exit 1
            fi
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            export RUN_DATE="{{workflow.parameters.run_date}}"
            export RUN_ID="{{workflow.parameters.run_id}}"
            export EVAL_TEXT="{{workflow.parameters.eval-text-column}}"
            export EVAL_CODE="{{workflow.parameters.eval-code-column}}"
            export FT_TEXT="{{workflow.parameters.ft-text-column}}"
            export FT_CODE="{{workflow.parameters.ft-code-column}}"
            export FINE_TUNE="{{workflow.parameters.fine-tune}}"
            uv run --locked --no-dev python - <<'EOF'
            import os
            import sys

            import duckdb
            from codif_common.contracts import artifact
            from src.preprocessing.data_preparation import configure_s3

            run = {"run_date": os.environ["RUN_DATE"], "run_id": os.environ["RUN_ID"]}
            paths = {
                "eval-file": artifact("classify-regex", "test_without_regex", **run),
                "ft-data": artifact("build-datasets", "annotations_full", **run),
                "mapping-file": artifact("prune-codes", "mapping_lvl4", **run),
            }
            con = duckdb.connect()
            configure_s3(con)

            def check(name, columns):
                path = paths[name]
                try:
                    found = set(con.execute(f"DESCRIBE SELECT * FROM '{path}'").df()["column_name"])
                except Exception as exc:
                    sys.exit(f"[resolve-inputs] {name} illisible : {path}\n  {exc}")
                missing = [c for c in columns if c not in found]
                if missing:
                    sys.exit(f"[resolve-inputs] {name} ({path}) : colonnes absentes {missing}")
                n = con.execute(f"SELECT count(*) FROM '{path}'").fetchone()[0]
                print(f"[resolve-inputs] {name:12s} {n:>9,} lignes  {path}")
                return path

            eval_file = check("eval-file", [os.environ["EVAL_TEXT"], os.environ["EVAL_CODE"]])
            code = os.environ["EVAL_CODE"]
            n_labels = con.execute(
                f"SELECT count(*) FROM '{eval_file}' WHERE nullif(trim(CAST(\"{code}\" AS VARCHAR)), '') IS NOT NULL"
            ).fetchone()[0]
            if n_labels == 0:
                sys.exit(f"[resolve-inputs] aucune étiquette dans « {code} » : label-column désigne-t-il la bonne colonne de input_file ?")
            print(f"[resolve-inputs] étiquettes {n_labels:>9,}")
            check("mapping-file", ["code", "code_parent_equivalent"])
            if os.environ["FINE_TUNE"] == "true":
                check("ft-data", [os.environ["FT_TEXT"], os.environ["FT_CODE"]])
                if paths["ft-data"] == eval_file:
                    sys.exit("[resolve-inputs] ft-data = jeu d'évaluation : le modèle serait évalué sur ses données de fine-tuning")

            for name, path in paths.items():
                with open(f"/tmp/{name}", "w") as f:
                    f.write(path)
            EOF
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
