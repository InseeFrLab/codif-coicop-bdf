            cpu: 2000m

    - name: predict-evaluate
      inputs:
        parameters:
          - name: model-uri
          - name: variant
          - name: eval-file
          - name: mapping-file
          - name: ft-data
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            PREFIX="{{workflow.parameters.output-prefix}}/{{inputs.parameters.variant}}"

            # Ligne d'en-tête propre au modèle fine-tuné (positionnels : garde les espaces).
            set --
            case "{{inputs.parameters.variant}}" in
              fine-tuned*) set -- --report-meta "Données de fine-tuning={{inputs.parameters.ft-data}}" ;;
            esac

            uv run --locked --no-dev main.py predict-basic \
              --model "{{inputs.parameters.model-uri}}" \
              --file "{{inputs.parameters.eval-file}}" \
              --output "$PREFIX/predictions.parquet" \
              --text-column "{{workflow.parameters.eval-text-column}}" \
              --top-k {{workflow.parameters.top-k}}

            CATEGORY=""
            if [ -n "{{workflow.parameters.eval-category-column}}" ]; then
              CATEGORY="--category-column {{workflow.parameters.eval-category-column}}"
            fi

            # Le rapport texte part sur stdout : il est dans la log de l'étape.
            uv run --locked --no-dev main.py evaluate-predictions "$PREFIX/predictions.parquet" \
              --code-column "{{workflow.parameters.eval-code-column}}" \
              --text-column "{{workflow.parameters.eval-text-column}}" \
              --max-k {{workflow.parameters.max-k}} \
              $CATEGORY \
              --output "$PREFIX/evaluation_report.txt" \
              --html-output "$PREFIX/evaluation_report.html" \
              --mapping-file "{{inputs.parameters.mapping-file}}" \
              --report-meta "Fichier évalué (input_file)={{workflow.parameters.input_file}}" \
              --report-meta "Variante={{inputs.parameters.variant}}" \
              --report-meta "Modèle={{inputs.parameters.model-uri}}" \
              --report-meta "Jeu d'entraînement={{workflow.parameters.train-data}}" \
              --report-meta "Cible={{workflow.parameters.code-column}}" \
              --report-meta "Workflow Argo={{workflow.name}}" \
              "$@"

            echo "[predict-evaluate] modèle      : {{inputs.parameters.model-uri}}"
            echo "[predict-evaluate] prédictions : $PREFIX/predictions.parquet"
            echo "[predict-evaluate] rapport     : $PREFIX/evaluation_report.html"
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 20Gi
            cpu: 8000m
