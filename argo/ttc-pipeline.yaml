apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ttc-predictions-
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  # `git -c http.version=HTTP/1.1` sur tous les clones : NE PAS RETIRER.
  # Le git de l'image (2.54.0, lié à libcurl3-gnutls) n'arrive pas à lire la
  # réponse HTTP/2 de GitHub — il échoue sur « expected flush after ref
  # listing » puis réclame un Username, ce qui fait croire à tort à un problème
  # d'authentification. GitHub répond pourtant 200 avec le bon content-type
  # (vérifié en trace GIT_CURL_VERBOSE). Forcer HTTP/1.1 neutralise la couche
  # de transport fautive en conservant le protocole git v2.

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: classify-ttc
            template: classify-ttc

    - name: classify-ttc
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: sample_size
          - name: classify-rag-model
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [ sh, -c ]
        args:
          - |
            set -e
            git -c http.version=HTTP/1.1 clone --branch main https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/classify-ttc
            uv sync --locked --no-dev

            uv run --locked --no-dev main.py predict-basic \
              --model "mlflow-artifacts:/10/cacf2603514b4887bbfb77e2654c9bc1/artifacts/model" \
              --file "s3://projet-budget-famille/data/output-annotation-consolidated/annotations-consolidated-2026-04-15/raw_test.parquet" \
              --output "s3://projet-budget-famille/data/workflow_outputs/outputs_ttc/predictions_{{= sprig.date "20060102150405" sprig.now }}.parquet" \
              --text-column l_pr_product \
              --top-k 10
        env:
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: MLFLOW_TRACKING_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m
