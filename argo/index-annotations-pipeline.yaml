apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: index-annotations-
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  podSpecPatch: |
    containers:
      - name: main
        env:
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"

  # ---------------------------------------------------------------------------
  # Indexation de la vector DB des ANNOTATIONS (KB few-shot du RAG) — pipeline
  # autonome, hors du pipeline de classification. Même principe que
  # l'entraînement de classify-ttc et de reconcile-sirus : l'artefact coûteux
  # est produit ici, son identifiant est recopié dans le fichier de paramètres.
  #
  # Ce qu'on indexe : les PRODUITS DÉJÀ ANNOTÉS, c'est-à-dire
  # `annotations_full` + `suggester` au sens de build-datasets. Rien d'autre.
  # Il n'y a délibérément AUCUN paramètre `input_file` ici : ce paramètre
  # désigne les produits *à classer*, ce qui n'a rien à voir avec la
  # constitution d'une base d'exemples.
  #
  #   build-datasets ──→ prune-codes (--only kb) ──→ index-annotations
  #
  # `classify-regex` n'est pas dans la chaîne : la KB n'a pas à être filtrée
  # des produits que la regex sait coder.
  #
  # kb-scope :
  #   full  (DÉFAUT) → annotations_full : tous les produits annotés.
  #   train          → raw_train : l'ancien split. Conservé pour la transition,
  #                    destiné à disparaître. Il n'existait que faute de jeu de
  #                    test indépendant ; les nouveaux produits annotés en
  #                    fournissent un naturellement.
  #
  # En fin d'exécution, le log affiche la ligne à recopier :
  #     classify-rag-annotations-collection: coicop_annotations__full__<date>__<run_id>
  # ---------------------------------------------------------------------------

  arguments:
    parameters:
      - name: git-branch
        value: main

      - name: run_id
        value: "{{workflow.name}}"
      - name: run_date
        value:
          "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{wor\
          kflow.creationTimestamp.d}}"

      # Quels produits annotés composent la KB. Voir l'en-tête.
      - name: kb-scope
        value: full
        enum: [full, train]

      # Plafonne la KB réellement indexée, donc le temps d'embedding.
      # Vide = toute la KB.
      - name: kb-sample-size
        value: ""

      # Échappatoire : forcer un nom de collection exact. Vide = composé depuis
      # `qdrant.collection_base`, kb-scope et l'identité de ce run.
      - name: collection-name
        value: ""

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: build-datasets
            template: build-datasets
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"

          - name: prune-codes
            dependencies: [build-datasets]
            template: prune-codes
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: kb-scope
                  value: "{{workflow.parameters.kb-scope}}"

          - name: index-annotations
            dependencies: [prune-codes]
            template: index-annotations
            arguments:
              parameters:
                - name: run_id
                  value: "{{workflow.parameters.run_id}}"
                - name: run_date
                  value: "{{workflow.parameters.run_date}}"
                - name: kb-scope
                  value: "{{workflow.parameters.kb-scope}}"
                - name: kb-sample-size
                  value: "{{workflow.parameters.kb-sample-size}}"
                - name: collection-name
                  value: "{{workflow.parameters.collection-name}}"

    # -----------------------------------------------------------------------
    # Produit annotations_full, raw_train, raw_test et suggester — toujours,
    # sans dépendre d'un fichier d'entrée : seul `observations.parquet` en
    # dépendrait, et on n'en a pas besoin ici.
    #
    # Le bloc `env` est celui du template build-datasets d'origine : il exige
    # AWS_S3_ENDPOINT et AWS_ENDPOINT_URL (os.environ nu dans save_data.py),
    # que les étapes d'indexation n'ont pas. Ne pas mutualiser les blocs.
    # -----------------------------------------------------------------------
    - name: build-datasets
      inputs:
        parameters:
          - name: run_id
          - name: run_date
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/build-datasets
            uv sync --locked --no-dev
            uv run --locked --no-dev main.py --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: AWS_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_S3_ENDPOINT
          - name: AWS_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ENDPOINT_URL
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # `--only kb` : nomenclature + mapping (nécessaires au pruning des codes),
    # puis la KB et le suggester. Pas de jeu à coder.
    # Les deux sources pointent sur build-datasets, pas sur classify-regex
    # (KB non filtrée par la regex) ni sur le CSV brut du suggester (on prend
    # celui que build-datasets a préprocessé, qui porte déjà l_pr_product).
    # -----------------------------------------------------------------------
    - name: prune-codes
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
          - name: kb-scope
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/prune-codes
            uv sync --locked --no-dev
            BD="s3://projet-budget-famille/data/workflow_runs/{{inputs.parameters.run_date}}/{{inputs.parameters.run_id}}/build-datasets"
            case "{{inputs.parameters.kb-scope}}" in
              full)  KB="$BD/annotations_full.parquet" ;;
              train) KB="$BD/raw_train.parquet" ;;
              *)     echo "kb-scope invalide : {{inputs.parameters.kb-scope}}"; exit 1 ;;
            esac
            uv run --locked --no-dev scripts/main.py \
              --config {{inputs.parameters.config}} \
              --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}} \
              --only kb \
              --annotations-train "$KB" \
              --suggester-path "$BD/suggester.parquet" \
              --suggester-product-col l_pr_product
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m

    # -----------------------------------------------------------------------
    # Embedding de la KB (+ suggester) et création de la collection Qdrant.
    # Écrit un manifeste (kb-scope, modèle d'embedding, nombre de points) que
    # le pipeline de classification relit au démarrage.
    # -----------------------------------------------------------------------
    - name: index-annotations
      inputs:
        parameters:
          - name: config
            value: config/config.yaml
          - name: run_id
          - name: run_date
          - name: kb-scope
          - name: kb-sample-size
          - name: collection-name
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            git clone --branch {{workflow.parameters.git-branch}} https://github.com/InseeFrLab/codif-coicop-bdf.git repo
            cd repo/rag-annotations
            uv sync --locked --no-dev
            ARGS="--config {{inputs.parameters.config}} --run-id {{inputs.parameters.run_id}} --run-date {{inputs.parameters.run_date}}"
            ARGS="$ARGS --kb-scope {{inputs.parameters.kb-scope}}"
            [ -n "{{inputs.parameters.kb-sample-size}}" ] && ARGS="$ARGS --sample-size {{inputs.parameters.kb-sample-size}}"
            [ -n "{{inputs.parameters.collection-name}}" ] && ARGS="$ARGS --collection-name {{inputs.parameters.collection-name}}"
            uv run --locked --no-dev scripts/0_build_annotation_vector_db.py $ARGS
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: AWS_SESSION_TOKEN
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: DDC_ENCRYPTION_KEY
          - name: LLMLAB_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_URL
          - name: LLMLAB_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: LLMLAB_API_KEY
          - name: QDRANT_URL
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_URL
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_KEY
          - name: QDRANT_API_PORT
            valueFrom:
              secretKeyRef:
                name: secret-codif-coicop-bdf
                key: QDRANT_API_PORT
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m
