# config.yaml

annotations:
  s3_path: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/classify-regex/raw_test_without_regex.parquet"
  # Input à coder pruné : désormais produit par l'étape `prune-codes` unifiée.
  s3_path_rag: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune-codes/annotations_test_pruned.parquet"
  sample_size: null
  features:
    - id
    - l_pr_product
    - annee
    - code
    - coicop
    - shop
    - shop_type_name
    - budget
    - n_obs
    - source
  nature: null

qdrant:
  strategy: "with_hierarchy"
  # Racine du nom : le constructeur (0_create_vector_db.py) y ajoute la date et
  # l'id de SON run pour obtenir un nom unique. Surtout pas `collection_name` —
  # ce fichier est aussi lu par le consommateur (2_run_rag.py), à qui le nom
  # complet est passé en argument ; une clé `collection_name` ici l'inciterait
  # à retomber silencieusement sur l'ancienne collection partagée.
  collection_base: "coicop_notices"
  # Manifeste écrit à côté de chaque collection : c'est lui qui porte le modèle
  # d'embedding, la stratégie et le CSV source, que le nom ne peut pas contenir.
  manifests_root: "s3://projet-budget-famille/data/vector_db_manifests"
  upload_batch_size: 56

embedding:
  model_name: qwen3-embedding-8b
  model_len: 4096

retrieval:
  size: 10

llm:
  prompt_name: prompt-multi-level
  prompt_version: "12"
  model_name: gemma4-26b-moe #openai/gpt-oss-120b #google/gemma-3-27b-it
  temperature: 0.1
  max_tokens: 2048
  concurrency: 32
  # guided_decoding_backend: xgrammar  # uncomment if vLLM >= 0.6 (outlines removed)

coicop:
  path_raw: "s3://projet-budget-famille/data/coicop-2018_envoi_rmes_20251022.csv"
  # Nomenclature prunée + mapping : produits par l'étape `prune-codes` (par run).
  path_prunned_lvl4: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune-codes/nomenclature_pruned.parquet"
  path_mapping_lvl4: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/prune-codes/mapping_lvl4.parquet"

predictions:
  s3_path: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/classify-rag-notices/predictions.parquet"
  s3_path_retrieved_codes: "s3://projet-budget-famille/data/workflow_runs/{run_date}/{run_id}/classify-rag-notices/retrieved_codes.parquet"

eval:
  threshold_confidence: 0.7
  rules_path: config/rules.yaml
  prune: true

mlflow:
  experiment_name: test